<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地学基礎　第3章 第1節　地球のエネルギー収支｜確認問題アプリ</title>
<style>
:root{
  --bg:#eef3fa; --panel:#ffffff; --panel2:#f3f7fd; --line:#d3ddec;
  --ink:#1b2a3f; --sub:#5f7690; --accent:#1f6fb2; --accent2:#2f9e6e;
  --bad:#c8394c; --gold:#b8791a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,system-ui,sans-serif;
  line-height:1.8; font-size:16px; -webkit-text-size-adjust:100%;
}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 80px;}
header.top{
  background:linear-gradient(135deg,#2f7fc4,#1d5f96);
  border:none; border-radius:14px; padding:18px 20px; margin-bottom:16px;
  color:#fff; box-shadow:0 2px 10px rgba(31,111,178,.22);
}
header.top h1{margin:0 0 4px;font-size:20px;letter-spacing:.02em;color:#fff;}
header.top .sub{color:#dbeaf8;font-size:13px;margin:0;}
.badge{display:inline-block;background:rgba(255,255,255,.22);color:#fff;border-radius:999px;
  padding:2px 10px;font-size:12px;margin-right:6px;}

.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.tab{
  flex:1 1 150px; text-align:center; padding:12px 8px; border-radius:12px; cursor:pointer;
  background:var(--panel); border:1px solid var(--line); color:var(--sub);
  font-weight:700; font-size:14px; transition:.15s; user-select:none;
}
.tab:hover{background:var(--panel2);color:var(--ink);border-color:#a9c4e0;}
.tab.active{background:linear-gradient(135deg,#2f7fc4,#1d5f96);color:#fff;border-color:#1d5f96;
  box-shadow:0 2px 8px rgba(31,111,178,.25);}
.tab small{display:block;font-weight:400;font-size:11px;opacity:.9;margin-top:2px;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;
  box-shadow:0 1px 4px rgba(27,42,63,.06);}
.muted{color:var(--sub);font-size:13px;}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
.chip{
  padding:6px 12px;border-radius:999px;border:1px solid var(--line);
  background:#f7fafe;color:var(--sub);font-size:12.5px;cursor:pointer;user-select:none;
}
.chip:hover{border-color:var(--accent);color:var(--ink);}
.chip.on{background:#dceaf8;color:#14507f;border-color:#7fb0d8;font-weight:700;}

.btn{
  display:inline-block;padding:11px 20px;border-radius:10px;border:none;cursor:pointer;
  font-weight:700;font-size:15px;font-family:inherit;
  background:linear-gradient(135deg,#3a8fd0,#1f6fb2);color:#fff;
  box-shadow:0 2px 6px rgba(31,111,178,.25);
}
.btn:hover{filter:brightness(1.06);}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--sub);box-shadow:none;}
.btn.ghost:hover{color:var(--accent);border-color:var(--accent);background:#f5faff;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

.pbar{height:8px;background:#e3eaf4;border-radius:99px;overflow:hidden;margin:12px 0 6px;}
.pbar > i{display:block;height:100%;background:linear-gradient(90deg,#4d9ed8,#3fb98c);width:0;transition:.3s;}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);}

.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.tagS{background:#e2eefb;color:#17558a;font-size:11.5px;border-radius:6px;padding:2px 8px;font-weight:700;}
.tagT{background:#e0f3e8;color:#1d6b48;font-size:11.5px;border-radius:6px;padding:2px 8px;font-weight:700;}
.tagE{background:#fbeedd;color:#8a5316;font-size:11.5px;border-radius:6px;padding:2px 8px;font-weight:700;}
.qtext{font-size:17px;font-weight:700;margin:6px 0 14px;white-space:pre-wrap;}
.qlead{background:#f3f8fd;border-left:4px solid #7fb0d8;border-radius:0 8px 8px 0;
  padding:10px 14px;font-size:14.2px;color:#31465f;margin-bottom:12px;white-space:pre-wrap;}

.choices{display:flex;flex-direction:column;gap:9px;}
.choice{
  border:1px solid var(--line);background:#fbfdff;border-radius:10px;padding:12px 14px;
  cursor:pointer;font-size:15px;display:flex;gap:10px;align-items:flex-start;transition:.12s;
}
.choice:hover{background:#eef6ff;border-color:var(--accent);}
.choice .n{flex:0 0 24px;height:24px;border-radius:50%;background:#dceaf8;color:#17558a;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;margin-top:2px;}
.choice .t{white-space:pre-wrap;}
.choice.correct{background:#e6f7ee;border-color:#3fb98c;}
.choice.correct .n{background:#2f9e6e;color:#fff;}
.choice.wrong{background:#fdecee;border-color:#e0838f;}
.choice.wrong .n{background:#c8394c;color:#fff;}
.choice.locked{cursor:default;}
.choice.locked:hover{background:#fbfdff;border-color:var(--line);}
.choice.locked.correct:hover{background:#e6f7ee;border-color:#3fb98c;}
.choice.locked.wrong:hover{background:#fdecee;border-color:#e0838f;}

.result{border-radius:12px;padding:14px 16px;margin-top:14px;font-size:14.5px;}
.result.ok{background:#eefaf3;border:1px solid #8fd6b6;}
.result.no{background:#fdf0f2;border:1px solid #eaa5ae;}
.result h4{margin:0 0 6px;font-size:14px;letter-spacing:.04em;}
.result.ok h4{color:#1d6b48;}
.result.no h4{color:#a82b3d;}
.result .modal{background:#fff;border-radius:8px;padding:10px 12px;margin:8px 0;
  font-size:14.5px;white-space:pre-wrap;border-left:4px solid var(--accent2);}

.score{text-align:center;padding:14px 0 4px;}
.score .big{font-size:46px;font-weight:800;color:#1f6fb2;line-height:1.1;}
.score .lab{color:var(--sub);font-size:13px;}
table.br{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px;}
table.br th,table.br td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;}
table.br th{color:var(--sub);font-weight:600;font-size:12.5px;}
table.br td.num{text-align:right;white-space:nowrap;}
.mini{height:7px;background:#e3eaf4;border-radius:99px;overflow:hidden;width:100%;min-width:70px;}
.mini > i{display:block;height:100%;background:linear-gradient(90deg,#4d9ed8,#3fb98c);}

.note{background:#fdf8ec;border:1px solid #f0dcae;border-radius:10px;padding:12px 14px;
  font-size:13.2px;color:#4b3f24;margin-top:14px;}
.note b{color:#96650f;}

/* 小テスト */
.verdict{border-radius:14px;padding:20px 18px;text-align:center;margin-top:4px;}
.verdict.pass{background:linear-gradient(135deg,#e6f7ee,#d6f0e3);border:2px solid #3fb98c;}
.verdict.fail{background:linear-gradient(135deg,#fdf0f2,#fae2e6);border:2px solid #e0838f;}
.verdict .mark{font-size:40px;font-weight:800;letter-spacing:.12em;line-height:1.2;}
.verdict.pass .mark{color:#1d6b48;}
.verdict.fail .mark{color:#a82b3d;}
.verdict .sc{font-size:30px;font-weight:800;margin-top:2px;}
.verdict .li{font-size:13px;color:#5f7690;margin-top:4px;}
.dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:16px 0 2px;}
.dot{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:800;border:1px solid transparent;}
.dot.o{background:#e6f7ee;color:#1d6b48;border-color:#8fd6b6;}
.dot.x{background:#fdecee;color:#a82b3d;border-color:#eaa5ae;}
.dot small{display:block;font-size:9px;font-weight:600;opacity:.7;}
.foot{text-align:center;color:#7c8ea6;font-size:12px;margin-top:26px;}
@media(max-width:520px){
  .qtext{font-size:16px;} body{font-size:15px;}
  .wrap{padding:12px 10px 70px;}
  .choice{font-size:14.2px;}
}
</style>
</head>

<div class="wrap">

<header class="top">
  <h1>地学基礎　第3章　大気と海洋</h1>
  <p class="sub"><span class="badge">第1節</span>地球のエネルギー収支（教科書 p.70–85）　確認問題アプリ　－　全問4択</p>
</header>

<div class="tabs" id="tabs"></div>

<div id="app"></div>

<p class="foot">教科書 第3章第1節（p.72–83）準拠／入試チャレンジは共通テスト・国公立二次の出題分析にもとづく類題です。</p>
</div>

<script>
/* =========================================================
   問題データ　※すべて4択（type:"mc" / c:選択肢4つ / ai:正答index）
   ========================================================= */

const SECTIONS = {
  s1:"1 大気の構成と特徴①（p.72-73）",
  s2:"2 大気の構成と特徴②（p.74-75）",
  s3:"3 対流圏における水の変化（p.76-77）",
  s4:"4 太陽放射と地球放射（p.80-81）",
  s5:"5 地球を出入りするエネルギー（p.82-83）"
};

/* ---------- ① 基礎基本問題（70問） ---------- */
const BASIC = [
/* --- s1 --- */
{sec:"s1",q:"地球を取り巻く大気が存在する範囲を何というか。",
 c:["大気圏","対流圏","成層圏","外気圏"],ai:0,
 exp:"大気は地球の重力にとらえられており、その存在する範囲を大気圏という。上端は地表から約800〜1000 km とされる。"},
{sec:"s1",q:"大気圏の上端は、地表からおよそ何 km のところとされているか。",
 c:["約80〜100 km","約300〜500 km","約800〜1000 km","約5000 km"],ai:2,
 exp:"大気は上空にいくほど薄くなり、大気圏の上端は地表から約800〜1000 km とされる。（高度500 km 以上は外気圏）"},
{sec:"s1",q:"水蒸気を除いた大気の組成（体積%）で、最も多い成分はどれか。",
 c:["酸素","窒素","二酸化炭素","アルゴン"],ai:1,
 exp:"窒素 約78％＞酸素 約21％＞アルゴン 0.9％＞二酸化炭素 0.04％ の順。"},
{sec:"s1",q:"水蒸気を除いた大気の組成で、酸素は体積の約何％を占めるか。",
 c:["約1％","約21％","約38％","約78％"],ai:1,
 exp:"酸素は約21％。窒素 約78％とあわせて大気の99％近くを占める。"},
{sec:"s1",q:"水蒸気を除いた大気に含まれる二酸化炭素の割合は約何％か。",
 c:["約0.04％","約0.4％","約0.9％","約4％"],ai:0,
 exp:"二酸化炭素は約0.04％。ごく微量だが赤外線をよく吸収するため、温室効果に大きく関わる。なお0.9％はアルゴン。"},
{sec:"s1",q:"大気の組成（水蒸気を除く）がほぼ一定に保たれているのは、地表から高度およそ何 km までか。",
 c:["約10 km","約25 km","約50 km","約80 km"],ai:3,
 exp:"高度約80 km まで組成はほぼ一定。高度100 km 以上では紫外線などの作用で気体分子の多くが原子やイオンに変化している。"},
{sec:"s1",q:"大気の成分のうち、場所や季節によって割合が大きく変化するものはどれか。",
 c:["窒素","酸素","水蒸気","アルゴン"],ai:2,
 exp:"水蒸気の割合だけは場所・季節で大きく変化する。そのため大気の組成は「水蒸気を除く体積%」で示される。"},
{sec:"s1",q:"ある場所の上にある大気の重さによって生じる圧力を何というか。",
 c:["気圧","気温減率","潜熱","太陽定数"],ai:0,
 exp:"気圧という。底面積 1 m² の大気の柱が底面を押す力で表される。"},
{sec:"s1",q:"気圧に用いられる単位はどれか。",
 c:["hPa（ヘクトパスカル）","J（ジュール）","kW/m²","g/m³"],ai:0,
 exp:"気圧の単位は hPa（ヘクトパスカル）。kW/m² は太陽定数、g/m³ は飽和水蒸気量の単位。"},
{sec:"s1",q:"地表における平均的な気圧（1気圧）は約何 hPa か。",
 c:["約760 hPa","約1013 hPa","約101.3 hPa","約10130 hPa"],ai:1,
 exp:"1気圧＝約1013 hPa。760 は水銀柱の高さ（mm）で、単位も意味も異なる。"},
{sec:"s1",q:"1気圧は、およそ高さ何 m の水の柱が底面に及ぼす圧力に等しいか。",
 c:["約1 m","約10 m","約76 m","約100 m"],ai:1,
 exp:"約10 m の水柱に相当する。なお水銀柱では約76 cm（トリチェリの実験）。"},
{sec:"s1",q:"高度が高くなるほど気圧が低くなるのはなぜか。",
 c:["上空ほど気温が低いから","上空ほど重力が強くなるから","その場所より上にある大気の重さが減少するから","上空ほど水蒸気が多くなるから"],ai:2,
 exp:"気圧はその場所より上にある大気の重さで生じる。高度が上がるほど上にある大気が少なくなるので気圧は低くなる。"},
{sec:"s1",q:"標準大気において、富士山山頂（高度約3800 m）の気圧は約何 hPa か。",
 c:["約317 hPa","約633 hPa","約800 hPa","約1013 hPa"],ai:1,
 exp:"富士山頂 約633 hPa、エベレスト山頂（約8800 m）約317 hPa。"},
{sec:"s1",q:"高度100 km 以上の大気で起こっていることとして正しいものはどれか。",
 c:["水蒸気の割合が急に増える","紫外線などの作用で気体分子の多くが原子やイオンに変化している","窒素がすべて酸素に変わる","大気の密度が地表より大きくなる"],ai:1,
 exp:"高度100 km 以上では、太陽からの紫外線などの作用で気体分子の多くが原子やイオン（電荷を帯びた粒子）に変化している。"},

/* --- s2 --- */
{sec:"s2",q:"大気圏を4つの層に区分する基準となっているのは、高度にともなう何の変化か。",
 c:["気圧の変化","気温の変化","大気の密度の変化","水蒸気量の変化"],ai:1,
 exp:"気圧や密度は高度とともに単調に低下するが、気温は低下・上昇をくり返す。この気温の高度変化をもとに4層に区分する。"},
{sec:"s2",q:"大気圏の4つの層を、地表に近い方から順に並べたものはどれか。",
 c:["対流圏→中間圏→成層圏→熱圏","対流圏→成層圏→中間圏→熱圏","成層圏→対流圏→熱圏→中間圏","対流圏→成層圏→熱圏→中間圏"],ai:1,
 exp:"下から 対流圏（〜約10 km）→成層圏（約10〜50 km）→中間圏（約50〜80 km）→熱圏（約80〜500 km）。"},
{sec:"s2",q:"対流圏の上端を何というか。",
 c:["圏界面","オゾン層","逆転層","凝結高度"],ai:0,
 exp:"対流圏の上端を圏界面という。その高度は低緯度ほど高く高緯度ほど低い。また夏は高く冬は低い。"},
{sec:"s2",q:"対流圏で、気温が高度とともに低下するときの変化の割合を何というか。",
 c:["断熱膨張","気温減率","アルベド","潜熱"],ai:1,
 exp:"気温減率という。対流圏では平均で 100 m につき約0.65 ℃ 低下する。"},
{sec:"s2",q:"対流圏の平均的な気温減率はどれか。",
 c:["0.65 ℃/100 m","1.0 ℃/100 m","0.5 ℃/100 m","6.5 ℃/100 m"],ai:0,
 exp:"平均約0.65 ℃/100 m（＝6.5 ℃/km）。乾燥断熱減率 1.0 ℃/100 m と混同しないこと。"},
{sec:"s2",q:"圏界面の高度について正しいものはどれか。",
 c:["低緯度ほど低く、高緯度ほど高い","低緯度ほど高く、高緯度ほど低い","緯度によらず一定である","冬は高く、夏は低い"],ai:1,
 exp:"圏界面は低緯度ほど高く高緯度ほど低い。また夏は高く冬は低くなる。"},
{sec:"s2",q:"成層圏の高度範囲として最も適当なものはどれか。",
 c:["地表〜約10 km","約10〜50 km","約50〜80 km","約80〜500 km"],ai:1,
 exp:"成層圏は約10〜50 km。約20 km まで気温はほぼ一定で、それより上では高度とともに上昇する。"},
{sec:"s2",q:"オゾンの量が特に多くなっているのは、およそどの高度か。",
 c:["約10 km","約25 km","約50 km","約80 km"],ai:1,
 exp:"オゾンの多い領域をオゾン層といい、特に高度約25 km 付近で多い。"},
{sec:"s2",q:"成層圏の上部で高度とともに気温が上昇する理由はどれか。",
 c:["二酸化炭素が赤外線を吸収して大気を暖めるから","オゾンが紫外線を吸収して大気を暖めるから","地表からの熱が伝導で伝わるから","水蒸気が凝結して潜熱を放出するから"],ai:1,
 exp:"成層圏の気温上昇はオゾンによる紫外線の吸収による。二酸化炭素・水蒸気が吸収するのは赤外線であり、こちらは温室効果に関わる。"},
{sec:"s2",q:"成層圏でオゾン O₃ がつくられる過程として正しいものはどれか。",
 c:["酸素 O₂ に紫外線が作用してできる","二酸化炭素 CO₂ が分解してできる","水蒸気が電離してできる","窒素 N₂ と酸素 O₂ が結合してできる"],ai:0,
 exp:"成層圏では酸素分子 O₂ に紫外線が作用してオゾン O₃ ができる。オゾンは紫外線の強い低緯度で多く生じ、大気の循環で高緯度へ運ばれる。"},
{sec:"s2",q:"中間圏の気温変化として正しいものはどれか。",
 c:["高度とともに上昇する","高度とともに低下する","高度によらずほぼ一定である","約20 km までは一定で、その上は上昇する"],ai:1,
 exp:"中間圏（約50〜80 km）の気温は、対流圏と同じように高度が高くなるほど低下する。"},
{sec:"s2",q:"夏季の中間圏と熱圏の境界付近で見られることがある、薄い雲を何というか。",
 c:["巻雲","彩雲","夜光雲","笠雲"],ai:2,
 exp:"夜光雲という。一般には高緯度地域で見られるが、近年は中緯度地域でも観測されている。"},
{sec:"s2",q:"熱圏で高度とともに気温が上昇する理由として最も適当なものはどれか。",
 c:["オゾンが赤外線を吸収するから","太陽からの紫外線やX線、高速の電子などが吸収されるから","地表からの対流によって熱が運ばれるから","水蒸気が凝結するときに潜熱を放出するから"],ai:1,
 exp:"熱圏では太陽からの紫外線やX線、高速の電子などが吸収されるため、高度が高くなるほど気温が上昇する。"},
{sec:"s2",q:"極地方の熱圏で見られる、鮮やかな発光現象を何というか。",
 c:["夜光雲","オーロラ（極光）","流星","彩雲"],ai:1,
 exp:"オーロラ（極光）。太陽から放出された荷電粒子が高速で大気に突入し、原子や分子と衝突して発光する現象。"},
{sec:"s2",q:"オーロラが発光するしくみとして正しいものはどれか。",
 c:["オゾンが紫外線を吸収して光る","太陽からの荷電粒子が大気の原子・分子と衝突して発光する","雲の中の氷晶が太陽光を反射する","隕石が大気との摩擦で燃える"],ai:1,
 exp:"太陽から放出された電子などの荷電粒子が、地球の夜側の宇宙空間にたまり、高速で大気に突入して原子・分子と衝突し発光する。"},

/* =========================================================
   アプリ本体
   ========================================================= */
const ALL = BASIC.concat(THINK, EXAM);   // 小テスト用の全問プール

/* 選択肢の並びは固定。ただし正答の位置が①〜④に均等に散るよう、
   問題ごとに決まった量だけ巡回させる（毎回同じ並びになる）。 */
[BASIC, THINK, EXAM].forEach(arr => arr.forEach((q,i)=>{ q._k = i; }));

const QUIZ_N    = 10;   // 小テストの出題数
const QUIZ_PASS = 0.8;  // 合格ライン（8割）

const MODES = [
  {key:"basic", name:"基礎基本問題", desc:"用語・数値の定着", data:BASIC},
  {key:"think", name:"思考問題",     desc:"しくみの理解と計算", data:THINK},
  {key:"exam",  name:"入試チャレンジ",desc:"入試分析にもとづく類題", data:EXAM},
  {key:"quiz",  name:"小テスト",     desc:"ランダム10問・8割で合格", data:ALL}
];

let mode = "basic";
let secFilter = new Set();
let queue = [];
let idx = 0;
let answered = false;
let records = [];
let reviewing = false;   // 「まちがえた問題をもう一度」の復習ラウンド中か

const $ = s => document.querySelector(s);
const app = $("#app");

function renderTabs(){
  $("#tabs").innerHTML = MODES.map(m=>`
    <div class="tab ${m.key===mode?'active':''}" data-k="${m.key}">
      ${m.name}<small>${m.desc}${m.key==="quiz"?"":"・"+m.data.length+"問"}</small>
    </div>`).join("");
  document.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{ mode=t.dataset.k; secFilter=new Set(); renderTabs(); renderStart(); };
  });
}

function renderStart(){
  const data = MODES.find(m=>m.key===mode).data;
  const counts = {};
  Object.keys(SECTIONS).forEach(k=>counts[k]=data.filter(q=>q.sec===k).length);
  const chips = Object.keys(SECTIONS)
    .filter(k=>counts[k]>0)
    .map(k=>`<span class="chip ${secFilter.has(k)?'on':''}" data-s="${k}">${SECTIONS[k]}（${counts[k]}）</span>`).join("");

  const isQuiz = (mode==="quiz");
  const pool   = data.filter(q=>secFilter.size===0 || secFilter.has(q.sec)).length;
  const n      = Math.min(QUIZ_N, pool);
  const need   = Math.ceil(n*QUIZ_PASS);

  const guide = {
    basic:"教科書 p.72–83 の重要語句・数値を4択で確認します。選ぶとその場で採点され、解説が表示されます。",
    think:"「なぜそうなるのか」を問う説明選択問題と、計算問題です。選択肢を消去法でしぼるだけでなく、解説の考え方まで確認しましょう。",
    exam:"プロジェクトに保存された入試問題（共通テスト・国公立二次 56年分）を分析し、この単元から実際に出題されているテーマだけを抜き出して4択に再構成しました。各問に出題傾向を明記しています。",
    quiz:`基礎基本・思考・入試チャレンジの全${ALL.length}問から、毎回ランダムに${QUIZ_N}問を出題します。授業のはじめや家庭学習の総仕上げにどうぞ。`
  }[mode];

  const quizBox = isQuiz ? `
      <div class="verdict pass" style="padding:14px;margin:12px 0 2px;">
        <div style="font-size:14px;color:#1d6b48;font-weight:700;">出題 ${n} 問　／　合格ライン ${need} 問（${Math.round(QUIZ_PASS*100)}％）</div>
        <div class="li" style="margin-top:2px;">出題範囲を選ぶと、その範囲だけから${n}問出題されます</div>
      </div>` : "";

  app.innerHTML = `
    <div class="panel">
      <p style="margin:0 0 4px;font-weight:700;font-size:16px;">${MODES.find(m=>m.key===mode).name}</p>
      <p class="muted" style="margin:0 0 12px;">${guide}</p>
      ${quizBox}
      <p class="muted" style="margin:14px 0 2px;font-weight:700;">出題範囲を選ぶ（未選択なら全範囲）</p>
      <div class="filters" id="filters">${chips}</div>
      <div class="btnrow">
        <button class="btn" id="go">${isQuiz?`小テストを始める（ランダム${n}問）`:"この範囲で始める"}</button>
      </div>
      <div class="note">
        ${isQuiz
          ? `<b>ルール</b>　全${n}問に解答し、${need}問以上正解で<b>合格</b>です。1問ごとに正誤と解説が出ます。
             出題される${n}問は毎回変わるので、くり返し受けて合格を安定させましょう。`
          : `<b>使い方</b>　選択肢をタップ（クリック）すると即採点され、正解と解説が出ます。
             最後に小単元ごとの正答率が表示されるので、<b>まちがえた問題だけをもう一度</b>解いて弱点をつぶしましょう。`}
      </div>
    </div>`;

  document.querySelectorAll("#filters .chip").forEach(c=>{
    c.onclick=()=>{ const k=c.dataset.s; secFilter.has(k)?secFilter.delete(k):secFilter.add(k); renderStart(); };
  });
  $("#go").onclick = ()=>start();
}

function start(){
  const data = MODES.find(m=>m.key===mode).data;
  let pool = data.filter(q=>secFilter.size===0 || secFilter.has(q.sec));
  if(!pool.length){ alert("問題がありません。範囲を選び直してください。"); return; }

  if(mode==="quiz"){
    pool = pool.slice();
    for(let i=pool.length-1;i>0;i--){            // Fisher-Yates
      const j = Math.floor(Math.random()*(i+1));
      [pool[i],pool[j]] = [pool[j],pool[i]];
    }
    pool = pool.slice(0, Math.min(QUIZ_N, pool.length));
  }
  queue = pool;
  idx=0; records=[]; reviewing=false;
  renderQ();
}

/* 選択肢の並びは固定（同じ問題なら常に同じ順序）。
   ただし正答が①ばかり・②ばかりに偏らないよう、問題ごとに決まった量だけ巡回させる。 */
function orderChoices(q){
  const t = (q._k==null?0:q._k) % 4;             // 正答の位置を ①→②→③→④ と循環
  const shift = ((q.ai - t) % 4 + 4) % 4;
  return { c: q.c.slice(shift).concat(q.c.slice(0,shift)), ai: t };
}

function renderQ(){
  const q = queue[idx];
  const view = orderChoices(q);
  answered = false;
  const tagCls = mode==="basic"?"tagS":(mode==="think"?"tagT":"tagE");
  const pct = Math.round(idx/queue.length*100);
  const okCount = records.filter(r=>r.ok).length;

  app.innerHTML = `
    <div class="panel">
      <div class="pbar"><i style="width:${pct}%"></i></div>
      <div class="meta"><span>第 ${idx+1} 問 / 全 ${queue.length} 問</span><span>正解 ${okCount}</span></div>

      <div class="qhead" style="margin-top:14px;">
        <span class="${tagCls}">${SECTIONS[q.sec]}</span>
      </div>
      ${q.src?`<p class="muted" style="margin:0 0 8px;font-size:12.5px;">📘 ${escapeHtml(q.src)}</p>`:""}
      ${q.lead?`<div class="qlead">${escapeHtml(q.lead)}</div>`:""}
      <div class="qtext">${escapeHtml(q.q)}</div>
      <div class="choices" id="choices">
        ${view.c.map((t,i)=>`<div class="choice" data-i="${i}"><span class="n">${i+1}</span><span class="t">${escapeHtml(t)}</span></div>`).join("")}
      </div>
      <div id="fb"></div>
    </div>`;

  document.querySelectorAll("#choices .choice").forEach(el=>{
    el.onclick = ()=>{
      if(answered) return;
      const i = +el.dataset.i;
      answered = true;
      document.querySelectorAll("#choices .choice").forEach((e2,j)=>{
        e2.classList.add("locked");
        if(j===view.ai) e2.classList.add("correct");
        else if(j===i) e2.classList.add("wrong");
      });
      finish(i===view.ai, q, view);
    };
  });
}

function finish(ok, q, view){
  records.push({sec:q.sec, ok:ok, q:q});
  $("#fb").innerHTML = `
    <div class="result ${ok?'ok':'no'}">
      <h4>${ok?"◯ 正解":"× 不正解"}</h4>
      <div class="modal"><b>答え：${view.ai+1}</b>　${escapeHtml(q.c[q.ai])}</div>
      <div style="white-space:pre-wrap;">${escapeHtml(q.exp||"")}</div>
    </div>
    <div class="btnrow">
      <button class="btn" id="next">${idx+1<queue.length?"次の問題へ":"結果を見る"}</button>
    </div>`;
  $("#next").onclick = nextQ;
  $("#next").focus();
}

function nextQ(){
  idx++;
  if(idx < queue.length) renderQ();
  else renderResult();
}

function renderResult(){
  const total = records.length;
  const ok = records.filter(r=>r.ok).length;
  const rate = total? Math.round(ok/total*100):0;
  const wrongs = records.filter(r=>!r.ok).map(r=>r.q);

  const bySec = {};
  records.forEach(r=>{
    bySec[r.sec] = bySec[r.sec] || {n:0,o:0};
    bySec[r.sec].n++; if(r.ok) bySec[r.sec].o++;
  });
  const rows = Object.keys(SECTIONS).filter(k=>bySec[k]).map(k=>{
    const d = bySec[k], p = Math.round(d.o/d.n*100);
    return `<tr><td>${SECTIONS[k]}</td>
      <td style="width:90px;"><div class="mini"><i style="width:${p}%"></i></div></td>
      <td class="num">${d.o}/${d.n}（${p}%）</td></tr>`;
  }).join("");

  const isQuiz = (mode==="quiz") && !reviewing;   // 復習ラウンドは合否判定しない
  const need   = Math.ceil(total*QUIZ_PASS);
  const passed = ok >= need;

  const msg = isQuiz
    ? (passed
        ? (ok===total ? "満点です。文句なしの合格。" : `合格ラインの ${need} 問をこえました。この調子で別の${QUIZ_N}問にも挑戦しましょう。`)
        : `合格まであと ${need-ok} 問。まちがえた問題の解説を読んでから、もう一度受けてみましょう。`)
    : (rate>=90?"すばらしい。この単元は仕上がっています。":
       rate>=70?"よくできています。まちがえた項目だけ復習しましょう。":
       rate>=50?"あと一息。板書事項を読み返してから、もう一度挑戦を。":
                "まずは教科書 p.72–83 と板書事項を確認してから再挑戦しましょう。");

  const head = isQuiz ? `
      <div class="verdict ${passed?'pass':'fail'}">
        <div class="mark">${passed?"合　格":"不合格"}</div>
        <div class="sc">${ok} / ${total} 問（${rate}％）</div>
        <div class="li">合格ライン ${need} 問（${Math.round(QUIZ_PASS*100)}％）</div>
      </div>
      <div class="dots">
        ${records.map((r,i)=>`<div class="dot ${r.ok?'o':'x'}">${r.ok?"◯":"×"}<small>${i+1}</small></div>`).join("")}
      </div>`
    : `
      <div class="score">
        <div class="big">${rate}<span style="font-size:22px;">%</span></div>
        <div class="lab">${ok} / ${total} 問 正解</div>
      </div>`;

  app.innerHTML = `
    <div class="panel">
      ${head}
      <p style="text-align:center;margin:12px 0 0;font-size:14.5px;">${msg}</p>
      <table class="br">
        <tr><th>小単元</th><th></th><th class="num">正答率</th></tr>
        ${rows}
      </table>
      <div class="btnrow">
        ${wrongs.length?`<button class="btn" id="again">まちがえた ${wrongs.length} 問をもう一度</button>`:""}
        <button class="btn ${wrongs.length?'ghost':''}" id="retry">${isQuiz?`別の${QUIZ_N}問で受け直す`:"同じ範囲をもう一度"}</button>
        <button class="btn ghost" id="home">${isQuiz?"モード・範囲を選び直す":"出題範囲を選び直す"}</button>
      </div>
      ${wrongs.length?`<div class="note"><b>復習リスト</b><br>${
        wrongs.slice(0,15).map(w=>"・"+escapeHtml(w.q.replace(/\n/g," ").slice(0,44))+(w.q.length>44?"…":"")).join("<br>")
      }${wrongs.length>15?`<br><span style="color:#9fb2ce;">…ほか ${wrongs.length-15} 問</span>`:""}</div>`:""}
    </div>`;

  if(wrongs.length) $("#again").onclick = ()=>{ queue = wrongs; idx=0; records=[]; reviewing=true; renderQ(); };
  $("#retry").onclick = ()=>start();
  $("#home").onclick  = ()=>renderStart();
  window.scrollTo({top:0,behavior:"smooth"});
}

function escapeHtml(s){
  return (s==null?"":String(s))
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

renderTabs();
renderStart();
</script>
</body>
</html>
