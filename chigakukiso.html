<style>

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{

}
.wrap{max-width:900px;margin:0 auto;padding:16px 14px 80px;}
header.top{

}

.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
.tab{

}

  box-shadow:0 2px 8px rgba(31,111,178,.25);}
.tab small{display:block;font-weight:400;font-size:11px;opacity:.9;margin-top:2px;}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px;
  box-shadow:0 1px 4px rgba(27,42,63,.06);}
.muted{color:var(--sub);font-size:13px;}

.filters{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px;}
.chip{

}

}

.btn.ghost:hover{color:var(--accent);border-color:var(--accent);background:#f5faff;}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;}

.pbar{height:8px;background:#e3eaf4;border-radius:99px;overflow:hidden;margin:12px 0 6px;}

.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--sub);}

.qhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;}
.tagS{background:#e2eefb;color:#17558a;font-size:11.5px;border-radius:6px;padding:2px 8px;font-weight:700;}
.tagT{background:#e0f3e8;color:#1d6b48;font-size:11.5px;border-radius:6px;padding:2px 8px;font-weight:700;}
.tagE{background:#fbeedd;color:#8a5316;font-size:11.5px;border-radius:6px;padding:2px 8px;font-weight:700;}
.qtext{font-size:17px;font-weight:700;margin:6px 0 14px;white-space:pre-wrap;}

img.fig{display:block;width:100%;max-width:460px;margin:4px auto 14px;border-radius:10px;

.choices{display:flex;flex-direction:column;gap:9px;}
.choice{
  border:1px solid var(--line);background:#fbfdff;border-radius:10px;padding:12px 14px;
  cursor:pointer;font-size:15px;display:flex;gap:10px;align-items:flex-start;transition:.12s;
}
.choice:hover{background:#eef6ff;border-color:var(--accent);}
.choice .n{flex:0 0 24px;height:24px;border-radius:50%;background:#dceaf8;color:#17558a;
  display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;margin-top:2px;}
.choice .t{white-space:pre-wrap;}
.choice.correct{background:#e6f7ee;border-color:#3fb98c;}
.choice.correct .n{background:#2f9e6e;color:#fff;}
.choice.wrong{background:#fdecee;border-color:#e0838f;}
.choice.wrong .n{background:#c8394c;color:#fff;}
.choice.locked{cursor:default;}
.choice.locked:hover{background:#fbfdff;border-color:var(--line);}
.choice.locked.correct:hover{background:#e6f7ee;border-color:#3fb98c;}
.choice.locked.wrong:hover{background:#fdecee;border-color:#e0838f;}

.result{border-radius:12px;padding:14px 16px;margin-top:14px;font-size:14.5px;}
.result.ok{background:#eefaf3;border:1px solid #8fd6b6;}
.result.no{background:#fdf0f2;border:1px solid #eaa5ae;}
.result h4{margin:0 0 6px;font-size:14px;letter-spacing:.04em;}
.result.ok h4{color:#1d6b48;}
.result.no h4{color:#a82b3d;}

.score{text-align:center;padding:14px 0 4px;}
.score .big{font-size:46px;font-weight:800;color:#1f6fb2;line-height:1.1;}
.score .lab{color:var(--sub);font-size:13px;}
table.br{width:100%;border-collapse:collapse;margin-top:14px;font-size:14px;}

.mini > i{display:block;height:100%;background:linear-gradient(90deg,#4d9ed8,#3fb98c);}

.note{background:#fdf8ec;border:1px solid #f0dcae;border-radius:10px;padding:12px 14px;
  font-size:13.2px;color:#4b3f24;margin-top:14px;}
.note b{color:#96650f;}

.verdict{border-radius:14px;padding:20px 18px;text-align:center;margin-top:4px;}
.verdict.pass{background:linear-gradient(135deg,#e6f7ee,#d6f0e3);border:2px solid #3fb98c;}
.verdict.fail{background:linear-gradient(135deg,#fdf0f2,#fae2e6);border:2px solid #e0838f;}
.verdict .mark{font-size:40px;font-weight:800;letter-spacing:.12em;line-height:1.2;}
.verdict.pass .mark{color:#1d6b48;}
.verdict.fail .mark{color:#a82b3d;}
.verdict .sc{font-size:30px;font-weight:800;margin-top:2px;}
.verdict .li{font-size:13px;color:#5f7690;margin-top:4px;}
.dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;margin:16px 0 2px;}
.dot{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;

.dot.o{background:#e6f7ee;color:#1d6b48;border-color:#8fd6b6;}
.dot.x{background:#fdecee;color:#a82b3d;border-color:#eaa5ae;}
.dot small{display:block;font-size:9px;font-weight:600;opacity:.7;}
.foot{text-align:center;color:#7c8ea6;font-size:12px;margin-top:26px;}
@media(max-width:520px){

.lvtag{font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 8px;}
.lvtag.lv1{background:#e2eefb;color:#17558a;}
.lvtag.lv2{background:#e0f3e8;color:#1d6b48;}
.lvtag.lv3{background:#fbeedd;color:#8a5316;}
.kctag{font-size:11.5px;color:var(--sub);}

.result.hint{background:#fff8e8;border:1px solid #f0d79a;}
.result.hint h4{color:#96650f;}
.choice.dim{opacity:.42;text-decoration:line-through;cursor:default;}

.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 4px;}
.stat{flex:1 1 150px;background:#f4f8fd;border:1px solid var(--line);border-radius:12px;padding:12px 14px;}
.stat b{display:block;font-size:26px;color:#1f6fb2;line-height:1.2;}
.stat b small{font-size:14px;}
.stat span{font-size:12px;color:var(--sub);}
.wk{display:flex;gap:6px;margin:12px 0 4px;}
.wk span{flex:1;text-align:center;font-size:11.5px;padding:6px 0;border-radius:8px;
  background:#eef2f8;color:#93a5bd;border:1px solid var(--line);}
.wk span.on{background:#dcf0e6;color:#1d6b48;border-color:#8fd6b6;font-weight:800;}

.kctab td{vertical-align:top;}
.sub2{font-size:11.5px;color:var(--sub);}
.sq{display:inline-block;width:13px;height:13px;border-radius:4px;vertical-align:-2px;}
.sq.u{background:#dde6f2;} .sq.l{background:#8fc4ea;} .sq.m{background:#2f9e6e;}
.st{font-size:12px;font-weight:700;}
.st.u{color:#93a5bd;} .st.l{color:#1f6fb2;} .st.m{color:#1d6b48;}
.legend{font-size:12px;color:var(--sub);margin-top:8px;}
.tabs .tab{font-size:14px;padding:11px 8px;}

/* --- 単元カード（トップ画面） --- */
.ucards{display:flex;flex-direction:column;gap:14px;margin-top:6px;}
.ucard{border:1px solid #b9d4ec;background:linear-gradient(135deg,#f6fbff,#e9f2fb);
  border-radius:14px;padding:16px 18px;cursor:pointer;transition:.14s;position:relative;}
.ucard:hover{transform:translateY(-1px);box-shadow:0 5px 16px rgba(31,111,178,.20);border-color:#7fb0d8;}
.ucard:nth-child(2){background:linear-gradient(135deg,#f4fbf7,#e6f4ec);border-color:#a8ddc4;}
.ucard:nth-child(2):hover{box-shadow:0 5px 16px rgba(47,158,110,.20);border-color:#5fc39a;}
.ucard .unum{display:inline-block;font-size:11.5px;font-weight:800;letter-spacing:.06em;
  background:#1f6fb2;color:#fff;border-radius:6px;padding:2px 9px;margin-bottom:6px;}
.ucard:nth-child(2) .unum{background:#2f9e6e;}
.ucard .uttl{font-size:19px;font-weight:800;line-height:1.35;}
.ucard .usub{font-size:12.5px;color:var(--sub);margin-top:2px;}
.ucard .ubar{height:8px;background:#e0e9f4;border-radius:99px;overflow:hidden;margin:10px 0 8px;}
.ucard .ubar > i{display:block;height:100%;background:linear-gradient(90deg,#4d9ed8,#3fb98c);}
.ucard:nth-child(2) .ubar{background:#dfeee6;}
.ucard .urow{display:flex;justify-content:space-between;align-items:center;gap:10px;
  font-size:12.5px;color:var(--sub);flex-wrap:wrap;}
.ucard .urow b{color:#1f6fb2;font-size:15px;}
.ucard:nth-child(2) .urow b{color:#1d6b48;}
.badgeon{background:#1f6fb2;color:#fff;border-radius:999px;padding:3px 11px;font-weight:700;font-size:12px;}
.ucard:nth-child(2) .badgeon{background:#2f9e6e;}
.badgeoff{background:#e6ecf4;color:#7c8ea6;border-radius:999px;padding:3px 11px;font-size:12px;}
.tab.back{flex:0 1 auto;min-width:130px;background:#f3f7fd;color:var(--sub);font-size:13px;}
.tab.back small{display:block;font-size:11px;opacity:.85;}
.tab.back:hover{background:#e7f0fa;color:var(--accent);}

/* --- 授業運用モード --- */
.sidbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#f2f7fd;
  border:1px solid var(--line);border-radius:10px;padding:8px 12px;}
.sidlab{font-size:11.5px;color:var(--sub);}
.sidnum{font-size:19px;letter-spacing:.06em;color:#1f6fb2;}
.sidsub{font-size:12px;color:var(--sub);}
.btn.tiny{padding:5px 12px;font-size:12.5px;margin-left:auto;}
.sidinput{width:100%;max-width:220px;padding:14px 16px;font-size:26px;letter-spacing:.18em;

.sidinput.wide{max-width:100%;font-size:14px;letter-spacing:0;text-align:left;padding:11px 14px;}

.siderr{color:#c8394c;font-size:13px;margin:8px 0 0;min-height:1.2em;}

.scards{display:flex;flex-direction:column;gap:10px;}
.scard{border:1px solid var(--line);background:#fbfdff;border-radius:12px;padding:13px 16px;cursor:pointer;transition:.12s;}

.scard .stitle{font-size:15.5px;font-weight:700;}
.scard .srow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:4px;flex-wrap:wrap;}
.scard .smeta{font-size:12.5px;color:var(--sub);}

.sres.good{background:#e6f7ee;color:#1d6b48;} .sres.mid{background:#fdf3e3;color:#8a5316;}
.sres.low{background:#fdecee;color:#a82b3d;}  .sres.none{background:#eef2f8;color:#93a5bd;}

.modetag{font-size:11.5px;font-weight:800;border-radius:6px;padding:2px 9px;}
.modetag.check{background:#fbeedd;color:#8a5316;}

.score .big.good{color:#1d6b48;} .score .big.mid{color:#8a5316;} .score .big.low{color:#a82b3d;}
.sendbox{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;

.sendsid{font-weight:800;letter-spacing:.08em;opacity:.75;}

.warn{background:#fdf8ec;border:1px solid #f0dcae;border-radius:10px;padding:10px 14px;

.foot2{text-align:center;margin-top:18px;}

.adminbox{border-radius:10px;padding:11px 14px;font-size:13.5px;margin-bottom:10px;}

code{background:#eef2f8;border-radius:4px;padding:1px 5px;font-size:12.5px;}

.codein:focus{outline:none;border-color:var(--accent);}

{sec:"s5",src:"出題傾向：九州大（2025）─ 温室効果の原理（穴埋め）",
 lead:"地上の平均気温は約288 K であり、地球の放射平衡温度よりも高い。これは大気が太陽放射に比べて地表面の放射を【 ア 】ことによる。このような違いが生じる理由は、第一に二酸化炭素や水蒸気を代表とする大気中の温室効果ガスが可視光に比べて赤外線を【 イ 】こと、第二に太陽表面の温度と地表面の温度を比べると太陽表面の温度が【 ウ 】ため、太陽放射の波長が地表面の放射の波長より【 エ 】ことによる。",
 q:"【 ア 】〜【 エ 】に入る語の組合せとして最も適当なものはどれか。",
 c:["ア:通しやすい　イ:通しやすい　ウ:高い　エ:短い",
    "ア:通しにくい　イ:通しにくい　ウ:高い　エ:短い",
    "ア:通しにくい　イ:通しやすい　ウ:低い　エ:長い",
    "ア:通しやすい　イ:通しにくい　ウ:高い　エ:長い"],ai:1,
 exp:"大気は可視光線を主とする太陽放射はよく通すが、赤外線を主とする地球放射は通しにくい（＝よく吸収する）。\n太陽表面（約6000 K）は地表面（288 K）より温度が高いので、太陽放射の方が波長が短い。\nこの「入りやすく出にくい」性質が温室効果の本質である。"},

{sec:"s5",src:"出題傾向：横浜市立大（2023）─ 地表面のアルベド",
 q:"入射量に対する反射量の割合をアルベドという。次のうち、地表面において一般的にアルベドが最も大きいものはどれか。",
 c:["海面","森林","新雪の表面","アスファルト面"],ai:2,
 exp:"新雪の表面は白く、入射した太陽放射の大部分（0.8〜0.9程度）を反射するためアルベドが最も大きい。海面・森林・アスファルト面は黒っぽく、アルベドは 0.1 前後と小さい。\n★氷や雪が減ると地表のアルベドが小さくなり、さらに温暖化が進む（アイス・アルベド・フィードバック）。"},

{sec:"s4",src:"出題傾向：横浜市立大（2023）─ 大気の窓",
 lead:"地球放射の赤外線のうち、波長8〜13 μm の領域の赤外線は大気による吸収が小さく、ほとんど透過して宇宙へ放出される。",
 q:"この波長域は何とよばれるか。",
 c:["大気の窓","オゾンホール","圏界面","逆転層"],ai:0,
 exp:"「大気の窓」という。この波長域では温室効果ガスによる吸収が弱いため、地表からの赤外線が直接宇宙へ逃げていく。\n★気象衛星が地表面や雲頂の温度を測定できるのは、この波長域を利用しているため。"},

{sec:"s5",src:"出題傾向：大学入学共通テスト（2025 第2問 問1）─ 放射冷却",
 lead:"風が弱い晴れた秋の夜間は、地表から【 ア 】が放射されて地上気温が下がる。これを放射冷却という。雲・水蒸気が多いときや風が強いときは、放射冷却の効果は弱まる。",
 q:"【 ア 】に入る語と、放射冷却で翌朝の気温がより低下する日の組合せとして最も適当なものはどれか。",
 c:["ア:赤外線／低気圧に覆われ、雲が広がっている日",
    "ア:赤外線／高気圧に覆われ、風が弱く晴れている日",
    "ア:紫外線／高気圧に覆われ、風が弱く晴れている日",
    "ア:可視光線／低気圧に覆われ、雲が広がっている日"],ai:1,
 exp:"地表が放射するのは赤外線。高気圧に覆われると下降気流により晴天となり風も弱いため、地表からの赤外線が直接宇宙へ逃げて放射冷却が強まる。\n★共通テストでは天気図2枚を見せて「どちらの日が冷え込むか」を判断させる形式が定着している。"},

{sec:"s5",src:"出題傾向：大学入学共通テスト（2021 第2問B）─ 雲のフィードバック",
 lead:"地球温暖化により雲の量が増加したと仮定する。雲の量が増加し、雲による太陽放射の反射が【 ア 】すると、地表気温の上昇が抑制されると予想される。一方、雲の量が増加し、雲による地表面方向の赤外放射が【 イ 】すると、地表気温の上昇が促進されると予想される。",
 q:"【 ア 】・【 イ 】に入る語の組合せとして最も適当なものはどれか。",
 c:["ア:増加　イ:増加","ア:増加　イ:減少","ア:減少　イ:増加","ア:減少　イ:減少"],ai:0,
 exp:"どちらも「増加」。雲が増えれば太陽放射の反射（アルベド）が増えて冷却に働き、同時に雲からの下向き赤外放射も増えて加温に働く。\n両者が逆向きに効くため、雲は温暖化予測の最大の不確定要因とされる。\n★「反射＝冷やす」「赤外放射＝暖める」と役割を整理して覚える。"},

{sec:"s5",src:"出題傾向：大学入学共通テスト（2017・2021）─ 温室効果の正誤",
 q:"温室効果について述べた文として最も適当なものはどれか。",
 c:["水蒸気は温室効果ガスであるが、メタンは温室効果ガスではない。",
    "二酸化炭素は温室効果ガスであるが、水蒸気は温室効果ガスではない。",
    "水蒸気とメタンは、どちらも温室効果ガスである。",
    "窒素と酸素は、どちらも温室効果ガスである。"],ai:2,
 exp:"温室効果ガス＝赤外線を吸収する気体。二酸化炭素・水蒸気・メタン・一酸化二窒素・フロンなどが該当する。\n★大気の大部分を占める窒素・酸素は温室効果ガスではない、という点が繰り返し問われている。"},

{sec:"s3",src:"出題傾向：大学入学共通テスト（2018 第2問）─ 潜熱と雲・霧",
 lead:"寺田寅彦の随筆「茶碗の湯」を題材とした問題。茶碗から立ちのぼる白い湯気について述べている。",
 q:"（1）湯気の正体、（2）茶碗の湯が表面から冷える過程 の組合せとして最も適当なものはどれか。",
 c:["(1)水蒸気そのもの　(2)可視光線の反射",
    "(1)水蒸気が冷えて小さなしずくになったもの（雲や霧と同じ）　(2)潜熱の放出",
    "(1)小さな塵が群がったもの　(2)紫外線の放射",
    "(1)水蒸気が冷えて小さなしずくになったもの（雲や霧と同じ）　(2)二酸化炭素の放出"],ai:1,
 exp:"(1) 湯気は水蒸気が冷えて凝結した微小な水滴の集まりで、雲や霧と同じもの。水蒸気そのものは無色透明で目に見えない。\n(2) 水が蒸発するとき、湯は潜熱を奪われて冷える。その水蒸気が湯気になるときには潜熱が放出される。設問では「潜熱の放出」が正答とされた。\n★潜熱の出入りは「蒸発・融解・昇華＝吸収／凝結・凝固＝放出」で整理する。"},

{sec:"s3",src:"出題傾向：茨城大（2023）／横浜市立大（2023）／名古屋大（2026）─ 凝結高度の計算〈発展〉",
 lead:"太平洋岸の地点A（高度0 m）にあった気温23 ℃ の空気塊が、斜面に沿って上昇した。この空気塊の地点A における露点は 15 ℃ であった。乾燥断熱減率を 1.0 ℃/100 m とする。",
 q:"雲ができ始める高度（地点B の高度）はおよそ何 m か。",
 c:["500 m","800 m","1500 m","2300 m"],ai:1,
 exp:"露点に達するまでに下がる温度＝23 − 15 ＝ 8 ℃\n乾燥断熱減率 1.0 ℃/100 m なので\n高度＝8 ÷ 1.0 × 100 ＝ 800 m\n★地学基礎の教科書では「未飽和の空気塊は100 m 上昇するごとに約1 ℃ 下がる」と書かれており、これが乾燥断熱減率にあたる。\n★この先、山を越えて吹き下りると気温が上がる現象がフェーン現象（第2節・二次試験頻出）。"},

{sec:"s4",src:"出題傾向：東京大（2026）／京都大（2025）─ 温度と放射エネルギー〈発展〉",
 lead:"熱帯の「背の高い雲」と亜熱帯の「背の低い雲」が、ともにシュテファン・ボルツマンの法則にしたがって宇宙空間へ放射エネルギーを放出しているとする。雲より上の大気による吸収や放出は無視できるものとする。",
 q:"単位面積あたりに放出される放射エネルギーが大きいのはどちらの雲か。理由とあわせて最も適当なものを選べ。",
 c:["背の高い雲。雲頂の高度が高く、宇宙に近いから。",
    "背の低い雲。雲頂の高度が低く雲頂温度が高いため、放射エネルギーが大きいから。",
    "背の高い雲。雲頂温度が低いほど放射エネルギーは大きくなるから。",
    "どちらも同じ。放射エネルギーは高度によらないから。"],ai:1,
 exp:"放射エネルギーは表面温度で決まり、温度が高いほど大きい（シュテファン・ボルツマンの法則 E＝σT⁴）。\n対流圏では上空ほど気温が低いので、雲頂が低い「背の低い雲」の方が雲頂温度が高く、放射エネルギーは大きい。\n★教科書レベルでは「気象衛星の赤外画像で、背の高い雲ほど白く（＝冷たく）写る」と同じ内容。"},

{sec:"s2",src:"出題傾向：都立大（2024）／千葉大（2024）─ オゾン層とオゾンホール",
 lead:"1980年代前半より、南極域上空で9〜10月を中心にオゾン量が極端に少なくなる現象（オゾンホール）が観測されるようになった。",
 q:"オゾン層とオゾンホールについて述べた文として、誤りを含むものはどれか。",
 c:["オゾンは主として成層圏で、酸素分子に紫外線が作用して生成される。",
    "オゾン層は波長の短い有害な紫外線を吸収し、地上の生物を保護している。",
    "オゾンホールの原因物質として、エアコンの冷媒などに使われたフロンが国際的に規制されるようになった。",
    "オゾン層は対流圏の上部に分布し、二酸化炭素が分解してできたオゾンからなる。"],ai:3,
 exp:"誤りは4。オゾン層は成層圏（高度約25 km 付近に最多）にあり、酸素分子 O₂ に紫外線が作用してできる。二酸化炭素の分解ではない。\n★1・2・3 はいずれも正しい記述。フロンは紫外線を受けて塩素原子を放出し、極域の低温条件下でオゾンを破壊する。"},

{sec:"s1",src:"出題傾向：新潟大（2023）／各大学 ─ 大気圏の区分の正誤",
 q:"大気圏の区分を説明する記述として適切なものを2つ選ぶ問題である。適切な記述の組合せはどれか。\nア：大気圏の最下層は成層圏とよばれ、気温は高さとともに低下する。\nイ：大気圏の下位から二番目の区分は成層圏とよばれ、気温は高さとともに少しずつ上昇する。\nウ：大気圏の最上層は熱圏とよばれ、気温は高さとともに上昇する。\nエ：大気圏の最下層は対流圏とよばれ、気温は高さとともに少しずつ上昇する。",
 c:["アとウ","イとウ","アとエ","ウとエ"],ai:1,
 exp:"イ：下から二番目は成層圏で、（約20 km より上では）高度とともに気温が上昇する → 正しい。\nウ：最上層は熱圏で、高度とともに気温が上昇する → 正しい。\nア：最下層は成層圏ではなく対流圏 → 誤り。\nエ：対流圏の気温は高度とともに低下する → 誤り。\n★「最下層＝対流圏（低下）」「最上層＝熱圏（上昇）」を軸に判定する。"}
];

       h2:"受け取るのは『影の面積』＝断面積 πR²。分配されるのは表面積 4πR²。だから平均は 1/4（約0.34 kW/m²）。"},

       h2:"温室効果は『太陽放射（可視光線）は通しやすく、地球放射（赤外線）は通しにくい』。吸収した赤外線を地表へ返すのが要点です。"},

   出題の決定（設計書 Rule 3：新規40% / 復習40% / 弱点補修20%）
   ========================================================= */
function unitKCs(u){ return KC_IDS.filter(k=>KCS[k].unit===u); }

function shuffled(a){
  const r=a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}

function kcPools(u){
  const t = todayStr();
  const review=[], fresh=[], weak=[];
  unitKCs(u).forEach(k=>{
    const c = S.kc[k];
    if(c.deferOn === t) return;                       // その日はもう出さない
    if(c.seen===0){ fresh.push(k); return; }
    if(c.mastered){ if(c.due && c.due<=t) review.push(k); return; }
    if(c.box===0) weak.push(k);                       // 直近で落としたKC
    else if(c.due && c.due<=t) review.push(k);
  });
  return {review, fresh, weak};
}

function pickKCs(n, kind, u){
  const p = kcPools(u);
  const R = shuffled(p.review), F = shuffled(p.fresh), W = shuffled(p.weak);
  if(kind==="review") return R.concat(W).slice(0,n);
  const wr = Math.round(n*0.4), wf = Math.round(n*0.4), ww = n-wr-wf;
  let out = R.slice(0,wr).concat(F.slice(0,wf)).concat(W.slice(0,ww));
  const rest = shuffled(R.slice(wr).concat(F.slice(wf)).concat(W.slice(ww)));
  while(out.length<n && rest.length) out.push(rest.shift());
  return shuffled(out);
}

function pickItem(kc, used){
  const lvs = KC_LEVELS[kc];
  const cur = S.kc[kc].lv;
  const order = lvs.slice().sort((a,b)=>Math.abs(a-cur)-Math.abs(b-cur) || a-b);
  for(const lv of order){
    const cand = ALL.filter(q=>q.kc===kc && q.lv===lv && !used.has(q.id));
    if(cand.length) return cand[Math.floor(Math.random()*cand.length)];
  }
  const any = ALL.filter(q=>q.kc===kc && !used.has(q.id));
  return any.length ? any[Math.floor(Math.random()*any.length)] : null;
}

function makeItem(q){
  const order = shuffled(q.c.map((t,i)=>i));
  return { q, c: order.map(i=>q.c[i]), ai: order.indexOf(q.ai) };
}

/* 復習演習の並べ方。
   期日が来ていなくても出題は止めない。忘却の度合いは「出す・出さない」ではなく
   「どれを先に出すか」に反映させる。
     にがて（直近で落とした）→ 期日の来た復習 → はじめて → 仕上げ（習得ずみ・期日前）
   その日に2回まちがえて先送りにした項目は最後に回す（やり直したい生徒は止めない）。 */
function drillOrder(u){
  const t = todayStr();
  const weak=[], review=[], fresh=[], rest=[], defer=[];
  unitKCs(u).forEach(k=>{
    const c = S.kc[k];
    if(c.deferOn === t){ defer.push(k); return; }
    if(c.seen === 0){ fresh.push(k); return; }
    if(!c.mastered && c.box === 0){ weak.push(k); return; }
    if(c.due && c.due <= t){ review.push(k); return; }
    rest.push(k);
  });
  return {weak:shuffled(weak), review:shuffled(review), fresh:shuffled(fresh),
          rest:shuffled(rest), defer:shuffled(defer)};
}

/* 項目の数より問題数のほうが多いので、節全体を何巡かして n 問ぶん集める。
   同じ項目から2問以上出ることはあるが、同じ問題は1回のセッションに1度だけ。 */
function buildDrill(u, n){
  const o = drillOrder(u);
  let seq = o.weak.concat(o.review, o.fresh, o.rest, o.defer);
  const all = unitKCs(u);
  const used = new Set(), items = [];
  let pass = 0;
  while(items.length < n && pass < 8){
    if(!seq.length){ seq = shuffled(all); pass++; continue; }
    const q = pickItem(seq.shift(), used);
    if(q){ used.add(q.id); items.push(makeItem(q)); }
  }
  return shuffled(items);
}

function buildSession(kind, n, u){
  const used = new Set(), items = [];
  pickKCs(n, kind, u).forEach(k=>{
    const q = pickItem(k, used);
    if(q){ used.add(q.id); items.push(makeItem(q)); }
  });
  return items;
}

/* JSONP で送る。<script> タグを使うので、HTMLファイルをパソコンに保存して
   ダブルクリックで開いた状態（file://）でも送信でき、成功も確認できる。 */
function jsonp(url, params, timeout){
  return new Promise(resolve=>{
    if(!url) return resolve(null);
    const cb = "gascb" + Math.random().toString(36).slice(2);
    let done = false;
    const sc = document.createElement("script");
    const tm = setTimeout(()=>finish(null), timeout||15000);
    function finish(r){ if(done) return; done=true; clearTimeout(tm);
      try{ delete window[cb]; }catch(e){ window[cb]=undefined; }
      if(sc.parentNode) sc.parentNode.removeChild(sc);
      resolve(r);
    }
    window[cb] = r=>finish(r);
    sc.onerror = ()=>finish(null);
    const q = new URLSearchParams(Object.assign({}, params, {callback:cb})).toString();
    sc.src = url + (url.indexOf("?")>=0 ? "&" : "?") + q;
    document.head.appendChild(sc);
  });
}

/* CORS で送る。GitHub Pages のような https のページからならこちらも使える。
   Content-Type を text/plain にしておくと事前確認（preflight）が走らないので、
   Apps Script でも応答をそのまま読み取れる。
   file:// で開いた場合はこちらは使えないので、上の JSONP が受け持つ。 */
async function corsPost(url, data, timeout){
  try{
    let ac = null, tm = 0;
    if(typeof AbortController === "function"){
      ac = new AbortController();
      tm = setTimeout(()=>{ try{ ac.abort(); }catch(e){} }, timeout || 15000);
    }
    const res = await fetch(url, {method:"POST", redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=utf-8"},
      body: JSON.stringify(data), signal: ac ? ac.signal : undefined});
    if(tm) clearTimeout(tm);
    if(!res.ok) return null;
    const t = await res.text();
    try{ return JSON.parse(t); }catch(e){ return null; }
  }catch(e){ return null; }
}

/* JSONP と CORS を同時に投げ、先に成功した方を採る。
   両方届いても、同じ送信キーの行はスクリプト側で無視されるので行は増えない。 */
function firstOk(ps){
  return new Promise(resolve=>{
    let left = ps.length, last = null;
    ps.forEach(p=>p.then(r=>{
      if(r && r.ok) return resolve(r);
      if(r) last = r;
      if(--left === 0) resolve(last);
    }, ()=>{ if(--left === 0) resolve(last); }));
  });
}

let lastResp = null;
const sleep = ms => new Promise(r=>setTimeout(r, ms));
/* 送信の流れ
   1. JSONP と CORS の両方で同時に送り、先に {ok:true} が返った方を採る。
      経路がひとつ塞がれていても、もう一方が通れば成功と分かる。
   2. どちらも返らないときは、応答を読めない POST でも投げたうえで、
      少し待ってから「本当に記録されたか」をスクリプトに問い合わせる（verify）。
   3. それでも確認できなければ失敗として扱い、キューに残す。
   同じ送信キーの行はスクリプト側で無視されるので、二重記録にはならない。 */
async function postResult(data){
  const url = sheetUrl();
  lastResp = null;
  if(!url) return "nourl";
  const r = await firstOk([ jsonp(url, data), corsPost(url, data) ]);
  lastResp = r;
  if(r && r.ok) return "ok";
  try{   // 念のため POST でも投げておく（この応答は読めない）
    await fetch(url, {method:"POST", mode:"no-cors",
      headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(data)});
  }catch(e){}
  const q = {verify:1, key:data.key, sid:data.sid};
  for(const wait of [2500, 5000]){   // 記録されたかを確認する
    await sleep(wait);
    const v = await firstOk([ jsonp(url, q, 12000), corsPost(url, q, 12000) ]);
    if(v && v.ok && v.found){ lastResp = v; return "ok"; }
  }
  return "fail";
}

function subCode(d){
  const w = String(d.wrong||"").split(" ").filter(Boolean)
              .map(x=>x.split("-")[1]).join(",");
  return [d.sid, d.code, String(d.ok)+"/"+d.n, (d.pass==="合格"?"G":"F")].join("-") + (w? "-"+w : "");
}
function parseCode(line){
  const m = String(line).trim().match(/^(\d{4})-(\d{3})-(\d+)\/(\d+)-([GF])(?:-([\d,]+))?$/);
  if(!m) return null;
  const sid=m[1], code=m[2], ok=+m[3], n=+m[4], pass=(m[5]==="G"?"合格":"不合格");
  const wrong = (m[6]||"").split(",").filter(Boolean).map(x=>code+"-"+x).join(" ");
  return {sid, cls:sid[1], no:sid.slice(2), code, ok, n,
          rate: n? Math.round(ok/n*100):0, pass, wrong};
}

/* 先生用の診断：経路ごとに、つながるか・何秒かかるか・何が返ったかを調べる */
async function diagOne(kind, url){
  const t0 = Date.now();
  if(kind === "jsonp"){
    const r = await jsonp(url, {ping:1}, 15000);
    return {ms: Date.now()-t0, ok: !!(r && r.ok), r,
            note: (r && r.ok) ? "応答あり"
                 : r ? ("エラー応答: " + (r.error||"内容不明"))
                     : "応答なし（読み込み失敗か時間切れ）"};
  }
  try{
    const res = await fetch(url, {method:"POST", redirect:"follow",
      headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({ping:1})});
    const txt = await res.text();
    let r = null; try{ r = JSON.parse(txt); }catch(e){}
    return {ms: Date.now()-t0, ok: !!(r && r.ok), r,
            note: (r && r.ok) ? "応答あり"
                 : r ? ("エラー応答: " + (r.error||"内容不明"))
                     : ("HTTP " + res.status + " / " + txt.slice(0,60).replace(/\s+/g," "))};
  }catch(e){
    return {ms: Date.now()-t0, ok:false, r:null, note:"通信できません: " + (e && e.message ? e.message : e)};
  }
}

function queueResult(data){ S.outbox.push(data); saveState(); }
async function flushOutbox(){
  if(!S.outbox.length || !sheetUrl()) return 0;
  const keep = []; let sent = 0;
  for(const d of S.outbox){
    const r = await postResult(d);
    if(r==="ok" || r==="sent") sent++; else keep.push(d);
  }
  S.outbox = keep; saveState();
  return sent;
}

/* ---------- セッション ---------- */
/* 確認テストは、その小単元の項目（KC）をまんべんなく問う。
   KCを順ぐりに回りながら、各KCの中ではやさしいレベルから取る。 */
function buildCheck(sec){
  const pool = secItems(sec);
  const kcs = shuffled([...new Set(pool.map(q=>q.kc))]);
  const bag = {};
  kcs.forEach(k=>{
    bag[k] = shuffled(pool.filter(q=>q.kc===k)).sort((a,b)=>a.lv-b.lv);
  });
  const out = [];
  let guard = 0;
  while(out.length < Math.min(CHECK_N, pool.length) && guard++ < 200){
    let took = false;
    for(const k of kcs){
      if(out.length >= Math.min(CHECK_N, pool.length)) break;
      if(bag[k].length){ out.push(bag[k].shift()); took = true; }
    }
    if(!took) break;
  }
  return shuffled(out).map(makeItem);
}
function startSession(kind, sec){
  sessKind = kind; curSec = sec || null;
  queue = (kind==="check") ? buildCheck(sec) : buildDrill(curUnit, DRILL_N);
  if(!queue.length){ render(); return; }
  idx=0; attempt=0; answered=false; picked=new Set(); sessLog=[]; sessKcs=[];
  sessStart = Date.now(); sendState="";
  view="session"; nav(); renderQ();
}

function renderQ(){
  const it = queue[idx], q = it.q;
  attempt = 0; answered = false; picked = new Set();
  const dots = queue.map((_,i)=>{
    if(i<sessLog.length) return `<i class="${sessLog[i]?'o':'x'}"></i>`;
    return `<i class="${i===idx?'now':''}"></i>`;
  }).join("");
  const head = sessKind==="check"
    ? `<span class="modetag check">確認テスト</span><span class="qcode">${q.qid}</span><span class="kctag">${esc(SECTIONS[curSec])}</span>`
    : `<span class="modetag drill">復習演習</span><span class="qcode">${q.qid}</span><span class="lvtag lv${q.lv}">L${q.lv} ${["","認識","再生","適用"][q.lv]}</span><span class="kctag">${esc(KCS[q.kc].name)}</span>`;

  app.innerHTML = `
    <div class="panel">
      <div class="dots2">${dots}</div>
      <div class="qhead">${head}</div>
      ${q.src?`<p class="muted" style="margin:0 0 8px;font-size:12.5px;">📘 ${esc(q.src)}</p>`:""}
      ${q.lead?`<div class="qlead">${esc(q.lead)}</div>`:""}
      ${q.img?`<img class="fig" src="${CLOUD_IMG}" alt="十種雲形の模式図">`:""}
      <div class="qtext">${esc(q.q)}</div>
      <div class="choices" id="choices">
        ${it.c.map((t,i)=>`<div class="choice" data-i="${i}"><span class="n">${i+1}</span><span class="t">${esc(t)}</span></div>`).join("")}
      </div>
      <div id="fb"></div>
    </div>`;
  document.querySelectorAll("#choices .choice").forEach(el=>{
    el.onclick=()=>{ if(answered) return; const i=+el.dataset.i; if(picked.has(i)) return; onAnswer(it,i); };
  });
}

function onAnswer(it, i){
  const q = it.q, ok = (i===it.ai);
  attempt++; picked.add(i);

  if(ok && attempt===1){
    answered=true; lockChoices(it); recordAnswer(q,true);
    sessLog.push(true); sessKcs.push(q.kc);
    feedback("ok", q, it); return;
  }
  // 確認テストは選び直しなし。復習演習だけヒント→再挑戦。
  if(!ok && attempt===1 && sessKind!=="check"){
    document.querySelector(`#choices .choice[data-i="${i}"]`).classList.add("dim");
    const H = KCS[q.kc];
    $("#fb").innerHTML = `
      <div class="result hint">
        <h4>惜しい。もう一度考えてみましょう</h4>
        <div class="modal">${esc(q.lv<=1 ? H.h1 : H.h2)}</div>
        <p class="muted" style="margin:6px 0 0;font-size:13px;">残りの選択肢から選び直してください。</p>
      </div>`;
    return;
  }
  answered=true; lockChoices(it); recordAnswer(q,false);
  sessLog.push(false); sessKcs.push(q.kc);
  if(ok) feedback("re", q, it);
  else { if(sessKind!=="check") deferKC(q.kc); feedback("no", q, it); }
}
function lockChoices(it){
  document.querySelectorAll("#choices .choice").forEach((e,j)=>{
    e.classList.add("locked"); e.classList.remove("dim");
    if(j===it.ai) e.classList.add("correct");
    else if(picked.has(j)) e.classList.add("wrong");
  });
}
function feedback(kind, q, it){
  const carry = (kind==="no" && sessKind!=="check")
    ? `<p class="muted" style="margin:8px 0 0;font-size:13px;">この項目は<b>あしたの最初</b>にもう一度出ます。</p>` : "";
  $("#fb").innerHTML = `
    <div class="result ${kind==="no"?"no":"ok"}">
      <h4>${kind==="ok"?"◯ 正解":(kind==="re"?"◯ 正解（2回目）":"× 不正解")}</h4>
      <div class="modal"><b>答え：${it.ai+1}</b>　${esc(q.c[q.ai])}</div>
      <div style="white-space:pre-wrap;">${esc(q.exp||"")}</div>
      ${carry}
    </div>
    <div class="btnrow"><button class="btn" id="next">${idx+1<queue.length?"次へ":"終わって結果を送る"}</button></div>`;
  $("#next").onclick = next;
  $("#next").focus();
}
function next(){
  idx++;
  if(idx>=queue.length) endSession(); else renderQ();
}

/* ---------- 結果と送信 ---------- */
async function endSession(){
  const ok = sessLog.filter(Boolean).length, n = sessLog.length;
  const rate = n? Math.round(ok/n*100):0;
  const need = Math.ceil(n*PASS_RATE);
  const passed = ok >= need;
  const t = Math.round((Date.now()-sessStart)/1000);
  const p = parseSid(S.sid);

  const kcMark = {};
  sessKcs.forEach((k,i)=>{ kcMark[k] = (kcMark[k]===undefined? sessLog[i] : (kcMark[k] && sessLog[i])); });
  const wrong = queue.filter((it,i)=>!sessLog[i]).map(it=>it.q.qid);
  const code  = sessKind==="check" ? SEC_CODE[curSec] : String(CHAPTER)+U().no+"0";
  const title = sessKind==="check" ? SECTIONS[curSec] : "第"+U().no+"節 全体";

  const data = {
    key:newKey(), sid:S.sid, cls:p.cls, no:p.no, role:p.role,
    code: code,
    title: "第"+U().no+"節 "+U().name+"／"+title,
    mode: sessKind==="check" ? "確認" : "復習",
    n:n, ok:ok, t:t,
    pass: passed ? "合格" : "不合格",
    wrong: wrong.join(" "),
    marks: sessLog.map(v=>v?"1":"0").join(""),
    kcs: Object.keys(kcMark).map(k=>k+":"+(kcMark[k]?1:0)).join(" "),
    ver: APP_VER
  };
  S.results.push({unit:curUnit, sec:curSec, mode:data.mode, n:n, ok:ok, rate:rate,
                  pass:data.pass, code:code, wrong:data.wrong,
                  d:todayStr(), t:t, marks:data.marks, kcs:data.kcs, sid:S.sid});
  if(S.results.length>300) S.results = S.results.slice(-300);
  saveState();

  drawResult(data, rate, need, passed, "送信中…", "");
  let r = "nourl";
  if(sheetUrl()) r = await postResult(data);
  if(r==="fail") queueResult(data);
  drawResult(data, rate, need, passed,
    r==="ok"   ? ("◯ 先生に送信しました" + (lastResp && lastResp.sheet
                   ? "（" + lastResp.sheet + " の「" + (lastResp.tab||"記録") + "」タブ "
                     + (lastResp.row? lastResp.row+"行目":"") + "）" : "")) :
    r==="fail" ? ("× 送信できませんでした" + (lastResp && lastResp.error ? "（"+lastResp.error+"）" : "")) :
                 "－ 記録先が未設定です（この端末にだけ保存）",
    r);
}

function drawResult(data, rate, need, passed, sendMsg, state){
  const weak = data.kcs.split(" ").filter(x=>x.endsWith(":0")).map(x=>x.split(":")[0]);
  const msg = passed
    ? (data.ok===data.n ? "満点です。文句なしの合格。" : "合格ラインをこえました。よくできました。")
    : `合格まであと ${need-data.ok} 問。まちがえたところを読み直して、もう一度受けてみましょう。`;
  app.innerHTML = `
    <div class="panel">
      <div class="verdict ${passed?'pass':'fail'}">
        <div class="mark">${passed?"合　格":"不合格"}</div>
        <div class="sc">${data.ok} / ${data.n} 問（${rate}％）</div>
        <div class="li">合格ライン ${need} 問（${Math.round(PASS_RATE*100)}％）　－　問題番号 ${esc(data.code)}</div>
      </div>
      <div class="dots2 center">${data.marks.split("").map(m=>`<i class="${m==="1"?'o':'x'}"></i>`).join("")}</div>
      <p style="text-align:center;margin:12px 0 0;font-size:14.5px;">${msg}</p>
      <div class="sendbox ${sendMsg.startsWith("×")?"bad":(sendMsg.startsWith("－")?"warnb":"good")}">
        <span>${esc(sendMsg)}</span>
        <span class="sendsid">${esc(S.sid)}</span>
      </div>
      ${state==="fail"||state==="nourl" ? `
        <div class="codebox">
          <div class="cbttl">${state==="fail"
            ? "先生に送れませんでした。下の<b>提出コード</b>を Classroom に貼るか、この画面を撮って提出してください。"
            : "記録先が設定されていません。下の<b>提出コード</b>を提出してください。"}</div>
          <div class="cbcode" id="subcode">${esc(subCode(data))}</div>
          <div class="btnrow" style="margin-top:8px;">
            <button class="btn ghost tiny" id="copycode">コードをコピー</button>
            ${state==="fail"?`<span class="cbnote">学校の端末で開き直すと、たまった記録は自動で送られます。</span>`:""}
          </div>
        </div>` : ""}
      ${data.wrong?`<div class="note"><b>まちがえた問題</b>　${esc(data.wrong.split(" ").join("、"))}
        ${weak.length?`<br><b>もう一度確認したい項目</b><br>${weak.map(k=>"・"+esc(KCS[k].name)).join("<br>")}`:""}</div>`:""}
      <div class="btnrow" style="justify-content:center;">
        <button class="btn" id="back">もどる</button>
        <button class="btn ghost" id="top">単元をえらぶ</button>
      </div>
    </div>`;
  const cc=$("#copycode");
  if(cc) cc.onclick=()=>{
    const t = $("#subcode").textContent;
    const done = ()=>{ cc.textContent="コピーしました"; setTimeout(()=>cc.textContent="コードをコピー",1800); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done, ()=>sel()); }
    else sel();
    function sel(){
      const r=document.createRange(); r.selectNodeContents($("#subcode"));
      const s2=getSelection(); s2.removeAllRanges(); s2.addRange(r);
      try{ document.execCommand("copy"); done(); }catch(e){ cc.textContent="長押しで選択してコピー"; }
    }
  };
  const b=$("#back"); if(b) b.onclick=()=>{ view = (sessKind==="check")?"check":"drill"; render(); };
  const t=$("#top");  if(t) t.onclick=()=>{ view="top"; curUnit=null; render(); };
  window.scrollTo({top:0,behavior:"smooth"});
}

/* ---------- ふりかえり ---------- */
function renderLook(){
  const t = todayStr();
  const ks = unitKCs(curUnit);
  const mastered = ks.filter(k=>S.kc[k].mastered).length;
  const learning = ks.filter(k=>!S.kc[k].mastered && S.kc[k].seen>0).length;
  let rev=0, revOk=0; ks.forEach(k=>{ rev+=S.kc[k].rev; revOk+=S.kc[k].revOk; });
  const keep = rev? Math.round(revOk/rev*100) : null;

  const hist = S.results.filter(r=>r.unit===curUnit).slice(-8).reverse().map(r=>
    `<tr><td>${r.d.slice(5).replace("-","/")}</td>
     <td><span class="qcode">${r.code||""}</span>${esc(r.mode==="確認"? SECTIONS[r.sec] : "節全体の復習")}</td>
     <td class="num">${r.ok}/${r.n}　<span class="sres ${r.pass==="合格"?"good":"low"}">${r.pass||""}</span></td></tr>`).join("");

  const rows = ks.map(k=>{
    const c=S.kc[k], K=KCS[k];
    const st = c.mastered? "習得" : (c.seen? "学習中":"未着手");
    const cl = c.mastered? "m" : (c.seen? "l":"u");
    const due = c.due? (daysBetween(t,c.due)<=0?"今日":`${daysBetween(t,c.due)}日後`) : "—";
    return `<tr><td><span class="sq ${cl}"></span></td>
      <td>${esc(K.name)}<div class="sub2">${SECTIONS[K.sec]}　${K.type}　現在 L${c.lv}</div></td>
      <td class="num"><span class="st ${cl}">${st}</span><div class="sub2">次 ${due}</div></td></tr>`;
  }).join("");

  app.innerHTML = `
    <div class="panel">
      <p class="ttl">ふりかえり　－　第${U().no}節</p>
      <p class="muted" style="margin:0 0 12px;">くらべる相手は、過去の自分だけです。</p>
      <div class="stats">
        <div class="stat"><b>${mastered}<small>/${ks.length}</small></b><span>習得できた項目</span></div>
        <div class="stat"><b>${learning}<small>項目</small></b><span>学習中</span></div>
        <div class="stat"><b>${keep===null?"—":keep+"<small>%</small>"}</b><span>復習で思い出せた割合</span></div>
      </div>
      ${hist?`<p class="lb">これまでの結果</p><table class="br"><tr><th>日</th><th>内容</th><th class="num">結果</th></tr>${hist}</table>`:""}
      <p class="lb">項目ごとの状態</p>
      <table class="br kctab"><tr><th></th><th>できるようになること</th><th class="num">状態</th></tr>${rows}</table>
      <div class="legend"><span class="sq u"></span>未着手　<span class="sq l"></span>学習中　<span class="sq m"></span>習得（別の日に2回連続正解）</div>
    </div>`;
}

/* ---------- 先生用：問題一覧（番号から問題を引く） ---------- */
let listSec = "s1", listQ = "";
function renderList(){
  const secs = UNITS.flatMap(u=>u.secs);
  const chips = secs.map(sc=>
    `<span class="chip ${sc===listSec?'on':''}" data-s="${sc}"><b>${SEC_CODE[sc]}</b> ${SECTIONS[sc].replace(/（.*/,"")}</span>`).join("");
  const kw = listQ.trim();
  const pool = kw
    ? ALL.filter(q=>q.qid.indexOf(kw)>=0 || q.q.indexOf(kw)>=0 || KCS[q.kc].name.indexOf(kw)>=0)
    : ALL.filter(q=>q.sec===listSec);
  const rows = pool.slice().sort((a,b)=>a.qid.localeCompare(b.qid)).map(q=>`
    <tr>
      <td class="qn">${q.qid}<div class="sub2">L${q.lv}</div></td>
      <td>
        ${q.lead?`<div class="sub2">${esc(q.lead)}</div>`:""}
        <div class="qb">${esc(q.q)}</div>
        <div class="ans">正解：${esc(q.c[q.ai])}</div>
        <div class="sub2">誤答：${esc(q.c.filter((_,i)=>i!==q.ai).join(" ／ "))}</div>
        <div class="sub2">項目：${esc(KCS[q.kc].name)}</div>
      </td>
    </tr>`).join("");

  app.innerHTML = `
    <div class="panel">
      <p class="ttl">問題一覧（先生用）</p>
      <p class="muted" style="margin:0 0 12px;">スプレッドシートの「誤答問題」欄の番号を、ここで引けます。
        番号は問題ごとに固定で、端末や実施回によって変わりません。</p>
      <input class="sidinput wide" id="q" placeholder="番号やことばで検索（例：312-07／偏西風）" value="${esc(listQ)}">
      <div class="filters" style="margin-top:10px;">${chips}</div>
      <p class="muted" style="margin:10px 0 4px;">${pool.length} 問</p>
      <table class="br qlist">${rows}</table>
      <div class="btnrow"><button class="btn" id="back2">先生用の設定へ戻る</button></div>
    </div>`;
  const inp = $("#q");
  inp.oninput = ()=>{ listQ = inp.value; const pos=inp.selectionStart; renderList();
    const n=$("#q"); n.focus(); n.setSelectionRange(pos,pos); };
  document.querySelectorAll(".filters .chip").forEach(c=>c.onclick=()=>{ listSec=c.dataset.s; listQ=""; renderList(); });
  $("#back2").onclick = ()=>{ view="admin"; render(); };
}
