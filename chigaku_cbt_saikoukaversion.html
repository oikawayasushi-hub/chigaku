<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>地学基礎 CBT | 共通テスト7割確保</title>
  <style>
    :root {
      --primary: #2E7D32;
      --primary-light: #A5D6A7;
      --primary-pale: #E8F5E9;
      --primary-soft: #F1F8E9;
      --ink: #1B5E20;
      --ink-d: #0D3D1E;
      --ok: #2F9E44;
      --ok-bg: #E8F5E9;
      --ng: #E03131;
      --ng-bg: #FFEBEE;
      --bg: #FFFAF5;
      --card: #FFFFFF;
      --border: #D4E8D4;
      --tx: #2C3E50;
      --tx2: #7A8A7A;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
      background: var(--bg);
      color: var(--tx);
      line-height: 1.7;
      font-size: 16px;
    }

    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 0 14px 60px;
    }

    header {
      background: linear-gradient(135deg, #2E7D32, #1B5E20);
      color: var(--text-light);
      padding: 18px 14px 16px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(46, 125, 50, 0.18);
    }

    header .inner {
      max-width: 720px;
      margin: 0 auto;
    }

    header h1 {
      margin: 0;
      font-size: 19px;
      letter-spacing: 0.02em;
      font-weight: 800;
      color: #FFFFFF;
    }

    header p {
      margin: 4px 0 0;
      font-size: 12px;
      opacity: 0.9;
      font-weight: 600;
      color: rgba(255,255,255,0.95);
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(46, 125, 50, 0.09);
    }

    h2 {
      font-size: 16px;
      color: var(--ink);
      margin: 0 0 12px;
      padding-bottom: 8px;
      border-bottom: 3px solid var(--primary);
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
    }

    .btn {
      display: block;
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      font-family: inherit;
      text-align: left;
      transition: transform 0.08s, box-shadow 0.15s;
    }

    .btn:active {
      transform: scale(0.985);
    }

    .btn-main {
      background: linear-gradient(135deg, #2E7D32, #1B5E20);
      color: #FFFFFF;
      box-shadow: 0 3px 0 #0D3D1E;
    }

    .btn-main:hover {
      box-shadow: 0 4px 12px rgba(46, 125, 50, 0.3);
    }

    .btn-sub {
      background: #FFFFFF;
      color: var(--ink);
      border: 2.5px solid var(--primary);
    }

    .btn-ghost {
      background: var(--primary-pale);
      color: var(--ink);
      font-weight: 700;
    }

    .btn small {
      display: block;
      font-size: 11.5px;
      font-weight: 500;
      opacity: 0.8;
      margin-top: 3px;
      line-height: 1.5;
    }

    .mode-grid {
      display: grid;
      gap: 10px;
    }

    .cats {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .catrow {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--primary-pale);
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 10px 12px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .catrow:active {
      background: var(--primary-light);
    }

    .catrow .nm {
      flex: 1;
      font-size: 13.5px;
      font-weight: 800;
      color: var(--ink);
    }

    .catrow .wt {
      font-size: 10.5px;
      color: var(--tx2);
      font-weight: 500;
      display: block;
      margin-top: 1px;
    }

    .bar {
      width: 74px;
      height: 8px;
      background: #D4E8D4;
      border-radius: 4px;
      overflow: hidden;
      flex: none;
    }

    .bar i {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #2E7D32, #66BB6A);
      border-radius: 4px;
      transition: width 0.4s;
    }

    .pct {
      width: 44px;
      text-align: right;
      font-size: 12px;
      color: var(--tx2);
      flex: none;
      font-weight: 700;
    }

    .hud {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .chip {
      font-size: 11.5px;
      background: var(--primary-pale);
      color: var(--ink);
      border-radius: 20px;
      padding: 4px 11px;
      font-weight: 800;
    }

    .chip.level {
      background: #FFF3E0;
      color: #E65100;
    }

    .chip.combo {
      background: linear-gradient(135deg, #2E7D32, #66BB6A);
      color: #FFFFFF;
    }

    .qmeta {
      font-size: 11.5px;
      color: var(--tx2);
      margin-bottom: 6px;
    }

    .qtext {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 14px;
      line-height: 1.8;
    }

    .opts {
      display: grid;
      gap: 9px;
    }

    .opt {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      text-align: left;
      width: 100%;
      background: #FFFFFF;
      border: 2.5px solid var(--border);
      border-radius: 11px;
      padding: 12px 13px;
      font-size: 15px;
      font-family: inherit;
      color: var(--tx);
      cursor: pointer;
      line-height: 1.6;
      transition: background 0.2s;
    }

    .opt:active {
      background: var(--primary-pale);
    }

    .opt .no {
      flex: none;
      width: 23px;
      height: 23px;
      border-radius: 50%;
      background: var(--primary-pale);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 1px;
    }

    .opt.ok {
      border-color: var(--ok);
      background: var(--ok-bg);
    }

    .opt.ok .no {
      background: var(--ok);
      color: #FFFFFF;
    }

    .opt.ng {
      border-color: var(--ng);
      background: var(--ng-bg);
    }

    .opt.ng .no {
      background: var(--ng);
      color: #FFFFFF;
    }

    .fb {
      margin-top: 14px;
      border-radius: 11px;
      padding: 13px 14px;
      font-size: 13.5px;
      line-height: 1.8;
    }

    .fb.ok {
      background: var(--ok-bg);
      border-left: 5px solid var(--ok);
    }

    .fb.ng {
      background: var(--ng-bg);
      border-left: 5px solid var(--ng);
    }

    .fb .hd {
      font-weight: 800;
      font-size: 14px;
      margin-bottom: 5px;
    }

    .fb.ok .hd {
      color: var(--ok);
    }

    .fb.ng .hd {
      color: var(--ng);
    }

    .score {
      text-align: center;
      padding: 8px 0 4px;
    }

    .score .big {
      font-size: 48px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
    }

    .score .big span {
      font-size: 20px;
      font-weight: 700;
      color: var(--tx2);
    }

    .score .judge {
      display: inline-block;
      margin-top: 8px;
      padding: 6px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
    }

    .judge.pass {
      background: var(--ok);
      color: #FFFFFF;
    }

    .judge.near {
      background: #FFC107;
      color: #3D3526;
    }

    .judge.fail {
      background: #EFE6D2;
      color: var(--tx);
    }

    .rowbtns {
      display: grid;
      gap: 9px;
      margin-top: 14px;
    }

    .hide {
      display: none !important;
    }

    .screen {
      display: none;
    }

    .screen.active {
      display: block;
    }

    .progress-bar {
      height: 6px;
      background: #D4E8D4;
      border-radius: 3px;
      margin-bottom: 14px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--ok), #66BB6A);
      transition: width 0.3s;
    }

    footer {
      text-align: center;
      padding: 14px;
      font-size: 11px;
      color: var(--tx2);
      margin-top: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
    }

    th, td {
      border-bottom: 1px solid var(--border);
      padding: 8px 6px;
      text-align: left;
    }

    th {
      background: var(--primary-pale);
      color: var(--ink);
      font-size: 12px;
      font-weight: 800;
    }

    td.n {
      text-align: right;
      font-weight: 700;
    }

    .note {
      font-size: 12px;
      color: var(--tx2);
      line-height: 1.8;
      margin-top: 10px;
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn {
      padding: 10px 12px;
      border: 2px solid var(--border);
      background: var(--card);
      color: var(--ink);
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      border-color: var(--primary);
      background: var(--primary-pale);
      color: var(--ink);
    }

    .guide-content {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      line-height: 1.8;
    }

    .guide-content h3 {
      font-size: 15px;
      color: var(--ink);
      margin: 0 0 10px;
      font-weight: 800;
      border-bottom: 2px solid var(--primary-pale);
      padding-bottom: 6px;
    }

    .guide-content p {
      margin: 0 0 10px;
      font-size: 14px;
      color: var(--tx);
    }

    .guide-content ul {
      margin: 10px 0;
      padding-left: 20px;
    }

    .guide-content li {
      margin-bottom: 6px;
      font-size: 14px;
    }

    .guide-item {
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .guide-item:last-child {
      border-bottom: none;
    }

    .guide-label {
      font-size: 12px;
      font-weight: 800;
      color: var(--primary);
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .badge {
      display: inline-block;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: var(--primary-pale);
      color: var(--ink);
      font-weight: 700;
      margin-right: 5px;
    }

    .backbtn {
      font-size: 11.5px;
      font-family: inherit;
      font-weight: 800;
      color: var(--ink);
      background: var(--primary-pale);
      border: 1.5px solid var(--primary);
      border-radius: 20px;
      padding: 6px 14px;
      cursor: pointer;
      margin-top: 14px;
    }

    .backbtn:active {
      background: var(--primary-light);
    }

    @media (max-width: 600px) {
      body { font-size: 15px; }
      .wrap { padding: 0 12px 50px; }
      .btn { padding: 12px 14px; font-size: 14px; }
      .tabs { grid-template-columns: repeat(auto-fit, minmax(80px, 1fr)); }
    }
  </style>
</head>
<body>
<header>
  <div class="inner">
    <h1>🌍 地学基礎 CBT</h1>
    <p>共通テスト7割確保 | 155問・最適化版</p>
  </div>
</header>

<div class="wrap">
  <div id="app"></div>
  <footer>共通テスト本試験 2016〜2026年度の出題傾向をもとに構成／全<span id="qcount"></span>問</footer>
</div>

<script>
// ========== 最適化された問題データベース ==========
const BANK = [
  // 第1章：地球のすがた（L1基礎：15問、★★★頻出のみ）
  { c:1, l:1, q:'地球の層構造を外から順に並べたのは？', a:['地殻→マントル→外核→内核','地殻→外核→マントル→内核','マントル→地殻→外核→内核','内核→外核→マントル→地殻'], k:0, e:'地表から：地殻（厚さ約30km）→マントル（約2900km）→外核（液体、約2200km）→内核（固体、約1200km）。毎年出題。' },
  { c:1, l:1, q:'モホロビチッチ面（モホ面）の意味は？', a:['地表、地震波の反射面','約30～70km、地殻とマントルの境界','約2900km、マントルと外核の境界','地表下100km、地殻の最下部'], k:1, e:'モホ面：地殻とマントルの境界。地震波P波の速度が急に上昇する場所。共通テストで定番。' },
  { c:1, l:1, q:'プレートを構成する層はどれか？', a:['地殻のみ','マントル全体','地殻と上部マントルの一部','外核'], k:2, e:'リソスフェア（岩石圏）：地殻と上部マントルの一部（厚さ約100km）。これがプレート。最頻出。' },
  { c:1, l:1, q:'プレートの移動速度は？', a:['1mm/年','1cm/年','10cm/年','1m/年'], k:1, e:'プレートは年1～10cm程度で移動。爪が伸びる速さと同程度。これを知ることでテクトニクスの時間スケールが理解できる。' },
  { c:1, l:1, q:'プレート境界の3つのタイプは？', a:['張力・圧縮・剪断','沈み込み・裂開・横ずれ','発散・収束・保存','A・B・C'], k:2, e:'発散型（プレート引き離し）・収束型（プレート衝突）・保存型（プレート横ずれ）。これで地形や火山・地震の分布が決まる。' },
  { c:1, l:1, q:'中央海嶺が形成されるのはどの境界？', a:['沈み込み帯','トランスフォーム境界','発散型境界','収束型境界'], k:2, e:'発散型境界：プレートが引き離される→マグマ上昇→新しい地殻形成→中央海嶺。' },
  { c:1, l:1, q:'沈み込み帯で起こる現象は？', a:['中央海嶺の形成','山脈と火山の形成','正断層','リフト谷'], k:1, e:'沈み込み帯：海洋プレートが大陸プレートの下に潜り込む→圧縮→山脈・火山・大地震が発生。日本の地理的特徴。' },
  { c:1, l:1, q:'地球内部のどの層が液体か？', a:['地殻','マントル','外核','内核'], k:2, e:'外核は液体の鉄とニッケル。S波が透過できない。これが地磁気を生成する原因となっている。' },
  { c:1, l:1, q:'地球の平均密度として正しいのは？', a:['3.3 g/cm³','5.5 g/cm³','10.0 g/cm³','13.6 g/cm³'], k:1, e:'地球の平均密度は約5.5 g/cm³。岩石は約2.7 g/cm³だから、地球内部はもっと密度が高い（鉄など）。' },
  { c:1, l:1, q:'地球の赤道半径と極半径の関係として正しいのは？', a:['赤道半径>極半径','赤道半径<極半径','等しい','不確定'], k:0, e:'地球は赤道が膨らんだ回転楕円体。赤道半径6378km、極半径6357km。差は約21km。' },
  { c:1, l:1, q:'花崗岩の主成分鉱物は？', a:['長石のみ','長石・石英・雲母','オリビン・輝石','カルサイト'], k:1, e:'花崗岩：長石・石英・雲母から構成。粗粒で、深成岩（徐冷）。地殻の主要な構成物質。' },
  { c:1, l:1, q:'地殻を構成する最も多い元素は？', a:['鉄（Fe）','酸素（O）','珪素（Si）','アルミニウム（Al）'], k:1, e:'地殻の主要元素：酸素46%、珪素28%、アルミニウム8%、鉄6%。' },
  { c:1, l:1, q:'地球の磁場を生成する原因は？', a:['太陽風','地殻の岩石','外核の液体鉄の流動','月の引力'], k:2, e:'地球のダイナモ：外核の液体鉄がコリオリ力で回転→電流発生→磁場生成。' },
  { c:1, l:1, q:'ジオイドとは何か？', a:['正円形の地球','自由に流動する水面の延長面','地殻の表面','楕円体の地球'], k:1, e:'ジオイド：地球の真の形。重力ポテンシャルが等しい面。完全な楕円体ではなく、質量分布の影響で凹凸がある。' },
  { c:1, l:1, q:'アセノスフェア（弱い層）の役割は？', a:['プレートを支える岩盤','プレートの下にあり、マントル対流により動く層','地殻を強化する','S波を増幅する'], k:1, e:'アセノスフェア：リソスフェアの下、約100～700km。温度が高く、やや軟弱。マントル対流を生む。プレート運動を可能にする。' },

  // 第1章応用（L2：8問）
  { c:1, l:2, q:'リソスフェアとアセノスフェアの関係を最も適切に説明しているのはどれか？', a:['同じ層である','リソスフェアはアセノスフェアの上に浮き、マントル対流により動く','アセノスフェアの方が硬い','深さに関係なく存在する'], k:1, e:'プレート（リソスフェア）がアセノスフェア上で浮遊・運動する。これがプレートテクトニクスの基本メカニズム。' },
  { c:1, l:2, q:'玄武岩と花崗岩の化学組成の主な違いは？', a:['色だけ','シリカ（SiO₂）の含有量が異なる','冷却速度だけが異なる','元素組成が全く違う'], k:1, e:'玄武岩（低Si）と花崗岩（高Si）。シリカ含有量で密度や融点が決まり、マグマの粘性に影響。' },
  { c:1, l:2, q:'プレートの厚さはどの程度か？', a:['約10km','約50km','約100km','約200km'], k:2, e:'リソスフェアの厚さは約100km。地表からではなく、地表～約100kmが一つのプレート。' },
  { c:1, l:2, q:'太平洋プレートとユーラシアプレートが衝突するとき、どのプレートが沈み込むか？', a:['太平洋（若く、密度高い）','ユーラシア（古く、密度高い）','どちらも沈まない','交互に沈む'], k:0, e:'海洋プレートは大陸プレートより密度が高いため沈み込む。太平洋プレートが日本の下に沈み込み、火山と地震が発生。' },
  { c:1, l:2, q:'ホットスポットの火山列が斜めに配列する理由は？', a:['地震波の影響','プレートの運動方向','太陽の引力','火山活動の周期'], k:1, e:'ホットスポットは固定。その上をプレートが移動するため、古い火山列が斜めに並ぶ（ハワイなど）。' },
  { c:1, l:2, q:'地磁気の逆転はどのくらいの周期で起きるか？', a:['1000年','10万年','100万年','10万年～100万年'], k:3, e:'地磁気逆転の周期は不規則。直近の逆転は約78万年前。複数の知識を組み合わせて判断。' },
  { c:1, l:2, q:'セスルコア試料から何がわかるか？', a:['気温変化','地磁気反転の時期','地質時代の區分','磁性鉱物の濃度'], k:1, e:'セスルコア（地層柱状試料）に含まれる磁性鉱物から、地磁気反転の時期と方向がわかる。年代測定に利用。' },
  { c:1, l:2, q:'正断層と逆断層が形成される力学的な理由は？', a:['地球の自転','プレートの張力と圧縮','太陽放射','月の引力'], k:1, e:'張力でプレートが引っ張られる→正断層。圧縮でプレートが押される→逆断層。プレート境界の性質で決まる。' },

  // 第2章：地球の活動（L1基礎：15問）
  { c:2, l:1, q:'地震の最根本的な原因は？', a:['太陽風','プレートのストレス（応力）による破壊','マグマの上昇','地球の自転'], k:1, e:'プレートテクトニクスの運動により地殻にストレスが蓄積→限界を超える→破壊（地震）。これが全ての地震のメカニズム。' },
  { c:2, l:1, q:'震源とはどの位置か？', a:['地表で最も揺れる場所','地震波の発生地点','プレートの沈み込み地点','火山口'], k:1, e:'震源：地震波の発生地点。震央はその直上の地表地点。震源深さで浅発・中発・深発に分類。' },
  { c:2, l:1, q:'最も速く伝わる地震波は？', a:['S波','P波','表面波','ラブ波'], k:1, e:'P波（Primary）：圧縮波、速度約6km/s。S波（Secondary）：せん断波、速度約3.5km/s。表面波は最遅。毎年出題。' },
  { c:2, l:1, q:'S波が透過しない層はどれか？', a:['地殻','マントル','外核','内核'], k:2, e:'S波は液体を通らない。外核が液体だからS波が消える→震源の直反対側に「S波の影の領域」ができる。' },
  { c:2, l:1, q:'初期微動とは何か？', a:['地震波の始まり','P波が到達して地面が揺れ始める時間帯','地震の揺れ全体','S波だけを指す'], k:1, e:'初期微動：P波到達～S波到達の時間帯。この時間を調べると、震源距離がわかる。共通テストで毎年出題。' },
  { c:2, l:1, q:'マグニチュードが1増加するとエネルギーは何倍になるか？', a:['10倍','約32倍','100倍','1000倍'], k:1, e:'ログスケール。M+1で放出エネルギーは約32倍（√1000≈32）。M6とM7では大違い。計算問題の頻出。' },
  { c:2, l:1, q:'日本の震度階級は何段階か？', a:['7段階','8段階','10段階','12段階'], k:2, e:'日本の震度階：0,1,2,3,4,5弱,5強,6弱,6強,7の10段階。被害の大きさで判定。' },
  { c:2, l:1, q:'マグマのシリカ（SiO₂）含有量が多いほど？', a:['粘性が低い','粘性が高い','温度が高い','密度が低い'], k:1, e:'Si含有量多い→粘性高→ガス放出困難→爆発的噴火。Si含有量少ない→粘性低→穏やか。毎年出題。' },
  { c:2, l:1, q:'ハワイ式火山とプリニー式火山の違いは？', a:['活動の規模だけ異なる','マグマの粘性と噴火様式が異なる','マグマの温度だけ異なる','形が異なる'], k:1, e:'ハワイ式（低粘性）：流動的、穏やか、溶岩流。プリニー式（高粘性）：爆発的、火砕流。マグマ組成で決まる。' },
  { c:2, l:1, q:'火山の形でその活動性をどう判断するか？', a:['形は無関係','盾状火山=穏やか、円錐火山=爆発的','円錐火山=穏やか、盾状=爆発的','色で判断する'], k:1, e:'盾状火山（広い、低い、低粘性）：ハワイ式。円錐火山（急峻、高粘性）：プリニー式。形態から噴火様式がわかる。' },
  { c:2, l:1, q:'正断層と逆断層の違いは？', a:['上下ではなく水平にずれるのが正断層','正断層は張力、逆断層は圧縮','どちらも同じ性質','時代によって異なる'], k:1, e:'正断層：張力でプレートが引っ張られる→上の岩盤が下がる。逆断層：圧縮でプレートが押される→上の岩盤が上がる。' },
  { c:2, l:1, q:'褶曲（しゅうきょく）とは何か？', a:['地層が破断する','地層が曲がる・波状になる','地層が上昇する','すべての地殻変動'], k:1, e:'褶曲：圧縮力で地層が波状に曲がる。山脈ではよく見られる。アルプス山脈の地層構造で有名。' },
  { c:2, l:1, q:'示準化石が示準化石たる条件は？', a:['個体数が多いだけ','地球規模で分布＆生存期間短い＆進化が速い','すべての地層に含まれる','大きいだけ'], k:1, e:'示準化石：広く分布＆短い時間幅＆進化速度大→同年代の地層の判定に使える。最重要概念。' },
  { c:2, l:1, q:'アンモナイトが示準化石として優れている理由は？', a:['大きいから','進化が速く、短期間で形が大きく変わるから','世界中で見つかるから','すべての地層に含まれる'], k:1, e:'アンモナイト：中生代の代表示準化石。進化速度が高く、形態変化で時間軸に高い解像度を与える。' },

  // 第2章応用（L2：8問）
  { c:2, l:2, q:'初期微動継続時間が15秒の観測地は震源から約何km離れているか？', a:['45km','90km','135km','180km'], k:1, e:'計算式：距離 = 時間 × 6km/s × 3.5km/s ÷ (6-3.5)km/s ≈ 90km。計算問題の頻出。' },
  { c:2, l:2, q:'複数の観測点からのP波・S波データから、最も正確に推定できるのはどれか？', a:['震源の深さのみ','震源の位置と深さ','マグニチュード','火山活動の予兆'], k:1, e:'三点法：3つ以上の観測点の初期微動継続時間から、震源の位置（緯度・経度）と深さを三角測量で求める。' },
  { c:2, l:2, q:'同じ示準化石の系統が2層で見つかったら、両層は？', a:['同じ年代','まったく異なる年代','指定できない','下層のみ古い'], k:0, e:'同じ示準化石＝同年代。異なる系統＝異なる年代。地層の時代を判定するための基本原理。' },
  { c:2, l:2, q:'地層の重なり（累重の法則）から判断できることは？', a:['地層の温度','気候の変化','相対的な年代順序（新旧の判定）','生物の進化速度'], k:2, e:'累重の法則：下の地層が古く、上の地層が新しい。ただし褶曲・断層で順序が入れ替わることもある。' },
  { c:2, l:2, q:'火山灰の層が2つの地層の間に挟まっていることから何がわかるか？', a:['両地層は同じ年代','火山灰層の年代の地層である両者は同時期に堆積','火山活動は稀である','気候が寒冷だった'], k:1, e:'火山灰層のテフロクロノロジー：火山灰層は一瞬で堆積するため、その上下の地層の同時期性を証明。年代測定の手段。' },
  { c:2, l:2, q:'粘性の高いマグマと低いマグマでは、どちらが爆発的になるか？', a:['粘性が低い方','粘性が高い方','どちらも同じ','火山の位置に依存'], k:1, e:'粘性高→ガスが逃げにくい→圧力上昇→爆発的。粘性低→ガスが容易に放出→穏やか。シリカ含有量で決まる。' },
  { c:2, l:2, q:'隆起と沈降の速度が異なる地域があるのはなぜか？', a:['気候が異なる','プレート運動と地殻均衡の相互作用による','火山活動の有無','太陽活動の変化'], k:1, e:'アイソスタシー：地殻と上部マントルの密度バランスにより、地盤は上下運動。地域によって速度が異なる。' },
  { c:2, l:2, q:'プレート境界型地震と内陸型地震の主な違いは？', a:['同じもの','プレート境界型=海溝沿い・大規模、内陸型=陸域・一般に小さい','プレート境界型は火山活動','内陸型は鉱物の分解'], k:1, e:'プレート境界型：プレート同士の相互作用→大規模（M8以上）。内陸型：陸域内のプレートの破壊→中程度（M6-7）。' },

  // 第3章：大気と海洋（L1基礎：20問）
  { c:3, l:1, q:'太陽放射の波長組成で最も割合が大きいのは？', a:['紫外線（50%）','可視光線（約49%）','赤外線（95%）','X線'], k:1, e:'太陽放射：紫外線6%、可視光49%、赤外線45%。地球へ届く光の半分が見える光という意外性が重要。' },
  { c:3, l:1, q:'ウィーンの変位則で、物体の温度が高いほど波長は？', a:['長くなる','短くなる','変わらない','周期的に変わる'], k:1, e:'λ_max = 2.9×10^-3 / T。太陽（高温）は可視光、地表（低温）は赤外線。この対比が温暖化を理解する鍵。' },
  { c:3, l:1, q:'大気上端への入射エネルギーを100としたとき、標準的な配分は？', a:['反射30・吸収50・地表吸収20','反射30・吸収20・地表吸収50','反射50・吸収30・地表吸収20','反射20・吸収30・地表吸収50'], k:1, e:'30・20・50の配分。この比率は毎年出題される最重要テーマ。必ず覚えること。' },
  { c:3, l:1, q:'アルベドの定義は？', a:['放射されたエネルギーの割合','反射されたエネルギーの割合','吸収されたエネルギー','エネルギー収支の差'], k:1, e:'アルベド＝反射率。地球全体のアルベド≈30%。白い物質（雪）はアルベド0.8～0.9（高い）。' },
  { c:3, l:1, q:'アルベドが大きいほど地表気温は？', a:['上昇する','低下する','変わらない','不確定'], k:1, e:'アルベド大→反射大→吸収少→気温低下。気候変動で北極の海氷が減少するとアルベドが低下して気温上昇が加速。' },
  { c:3, l:1, q:'気温が高度とともに低下する層は？', a:['成層圏','対流圏','中間圏','熱圏'], k:1, e:'対流圏（地表~約10km）：気温低下。気温減率0.65℃/100m。天気が変わるのはこの層。毎年出題。' },
  { c:3, l:1, q:'大気圏の4層を気温変化で判定した場合の並び順は？', a:['対流圏→成層圏→中間圏→熱圏','成層圏→対流圏→熱圏→中間圏','対流圏→中間圏→成層圏→熱圏','熱圏→成層圏→対流圏→中間圏'], k:0, e:'対流圏（低下）→成層圏（上昇）→中間圏（低下）→熱圏（上昇）。パターンを覚えることが効率的。' },
  { c:3, l:1, q:'オゾン層の高度と役割は？', a:['地表、赤外線吸収','約20km、紫外線吸収','50km、可視光吸収','100km、X線吸収'], k:1, e:'オゾン層：約20km。波長200～320nmの紫外線（UV-B）を吸収。これがなければ紫外線が地表に到達→生物に害。' },
  { c:3, l:1, q:'温室効果ガスはどれか：N₂、CO₂、H₂O、O₂', a:['N₂とO₂','CO₂とH₂O','N₂とCO₂','すべて'], k:1, e:'CO₂とH₂O が温室効果ガス。N₂とO₂は赤外線をほぼ吸収しない。毎年出題される最重要テーマ。' },
  { c:3, l:1, q:'温室効果がなければ地表の平均気温は？', a:['0℃','-18℃','-40℃','38℃'], k:1, e:'現在≈15℃。温室効果がなければ≈-18℃。温室効果による上昇≈33℃。この差を理解することが気候学の入門。' },
  { c:3, l:1, q:'相対湿度100%のとき？', a:['実際の水蒸気圧>飽和水蒸気圧','実際の水蒸気圧=飽和水蒸気圧','実際の水蒸気圧<飽和水蒸気圧','無関係'], k:1, e:'相対湿度 = (実際 / 飽和) × 100%。100%なら両者が等しい。露点との関係も重要。' },
  { c:3, l:1, q:'潜熱とは何か？', a:['温度を上げる熱','温度を変えず状態変化に使う熱','隠れた熱','エネルギー移動'], k:1, e:'潜熱：蒸発（吸収）・融解（吸収）、凝結（放出）・凝固（放出）で使われる。温度変化なし。' },
  { c:3, l:1, q:'露点とは何か？', a:['朝の露','相対湿度が100%になる温度','気温が低くなる時刻','結露する高さ'], k:1, e:'露点：空気の温度がこれ以下になると凝結が起きる温度。湿度が高いほど露点が高い。' },
  { c:3, l:1, q:'海水の比熱として正しいのは？', a:['0.5 J/(g・℃)','1.0 J/(g・℃)','4.0 J/(g・℃)','10 J/(g・℃)'], k:2, e:'海水≈4.0 J/(g・℃)。砂≈0.8 J/(g・℃)。同じ熱量で砂は海水より5倍温度が上昇。これで海風が生まれる。' },
  { c:3, l:1, q:'海陸風が吹く理由は？', a:['地球の自転','陸と海の比熱の違い','コリオリの力','月の引力'], k:1, e:'日中：陸先に暖まる→気圧低下→海から風。夜間：陸先に冷える→気圧上昇→陸から風。比熱差が全ての原因。' },
  { c:3, l:1, q:'暖流の周辺への影響として正しいのはどれか？', a:['気温低下・霧多発','気温上昇・降水増加','気圧低下・暴風','日照時間増加'], k:1, e:'暖流（例：黒潮）は周辺気温を上げ、冬の降雪を減らす。冷流は気温低下＆霧多発。気候の大規模調整役。' },
  { c:3, l:1, q:'空気が上昇して雲ができるまでの順序は？', a:['凝結→膨張→露点','膨張→露点到達→凝結','露点→膨張→凝結','凝結→露点→膨張'], k:1, e:'上昇→断熱膨張→気温低下→露点に達する→凝結→雲形成。自然のプロセスを理解することが重要。' },

  // 第3章応用（L2：10問）
  { c:3, l:2, q:'エネルギー収支が平衡している状態は？', a:['季節による変動','受け取りエネルギー＝放出エネルギー','気温が上昇中','アルベドが増加'], k:1, e:'平衡→気温変化がない。これが地球の長期間での安定性の基本。温暖化は平衡が崩れている状態。' },
  { c:3, l:2, q:'温室効果によって気温が上昇するメカニズムは？', a:['太陽放射が増加','温室効果ガスが地表放射を吸収・再放射し、一部が地表に戻る','CO₂が直接熱を放出','オゾンが減少'], k:1, e:'ガスが「毛布」のように機能。地表放射を吸収→再放射→一部が地表に返される→気温上昇。毎年出題。' },
  { c:3, l:2, q:'成層圏で気温が上昇するのはなぜか？', a:['地表からの放射が多い','オゾンが紫外線を吸収しエネルギーが熱に変わる','太陽放射が直接当たる','地磁気の影響'], k:1, e:'オゾン（O₃）が紫外線を吸収 → 光化学エネルギー → 熱 → 成層圏が温暖化。この逆転層が対流を阻止。' },
  { c:3, l:2, q:'赤道と極での太陽放射エネルギー収支が不均衡な理由は？', a:['地球の自転','地球が球形なので低緯度ほど単位面積当たりの太陽放射が多い','海陸分布','オゾン層の濃度'], k:1, e:'球面への垂直入射と斜め入射の差。赤道は高緯度より2倍以上のエネルギーを受取。このため大循環が発生。' },
  { c:3, l:2, q:'大気圏とマントル対流のアナロジーで、対応するのはどれか？', a:['両方とも対流がある','低緯度と高緯度の温度差=マントルと地表の温度差','大気の循環はマントル対流とは独立','時間スケールが同じ'], k:0, e:'どちらも熱源から遠いほど冷える→対流が発生する。ただし時間スケールは全く異なる（大気：日～月、マントル：百万年）。' },
  { c:3, l:2, q:'ハドレー循環と中緯度の偏西風の関係を説明しているのはどれか？', a:['無関係','赤道での上昇気流→極での下降気流→コリオリの力で偏向→偏西風','太陽放射の直接的な結果','地磁気による','地磁気による'], k:1, e:'大規模気流の基本パターン。低気圧と高気圧の位置でジェット気流が生まれ、天気を支配。' },
  { c:3, l:2, q:'気温の日較差と年較差にはどのような傾向があるか？', a:['両方とも陸で大きい','両方とも海で大きい','日較差は陸で大、年較差は海で大','海陸関係なく同じ'], k:0, e:'比熱の大きい海は温度変化が小さい。陸地では日較差（昼-夜）と年較差（夏-冬）が両方大きい。' },
  { c:3, l:2, q:'オゾンホール形成の主犯とされるCFCのメカニズムは？', a:['直接オゾンを破壊','紫外線で分解→塩素原子放出→オゾン破壊','大気汚染物質','酸性雨の原因'], k:1, e:'CFC（クロロフルオロカーボン）：紫外線で分解→Cl放出→Clがオゾンを破壊。1個のClで10万個のO₃を破壊可能。' },
  { c:3, l:2, q:'地上と上空で気温と気圧の関係が異なる理由は？', a:['重力の大きさの違い','地上は大気に覆われているが上空はそうではない','太陽放射の吸収の違い','ガスの組成の違い'], k:2, e:'気圧は上にある空気の重さで決まる。高さとともに指数関数的に低下。気温とは独立した法則。' },

  // 第4章：宇宙と地球（L1基礎：15問、L2応用：8問）
  { c:4, l:1, q:'太陽のエネルギー源は？', a:['核分裂','核融合（H→He）','化学反応','重力収縮'], k:1, e:'太陽の中心：水素核融合。⁴He + 光 + ニュートリノ。毎秒6億トンのH→He。このエネルギーが地球を照らす。' },
  { c:4, l:1, q:'太陽の主成分は？', a:['酸素と珪素','水素74%とヘリウム24%','鉄と岩石','その他のガス'], k:1, e:'太陽：H 74%、He 24%、その他2%。最も古い天体で、最初に形成された元素の比率を反映。' },
  { c:4, l:1, q:'地球型惑星の特徴は？', a:['ガスで構成','小さく、密度が高い、衛星少ない','大きく、衛星が多い','すべてが同じ大きさ'], k:1, e:'地球型：水星・金星・地球・火星。小さい、密度高い、衛星少ない。岩石でできた惑星。' },
  { c:4, l:1, q:'木星型惑星の特徴は？', a:['固い表面がある','ガスと液体で構成、大きく、衛星多い','太陽に近い','大気がない'], k:1, e:'木星型：木星・土星・天王星・海王星。ガス巨人。この対比は太陽系の基本構造。' },
  { c:4, l:1, q:'金星の平均気温が地球より高い理由は？', a:['太陽に近いから','温室効果によるもの（CO₂大気）','ガスの成分','自転が遅いから'], k:1, e:'金星：平均気温≈460℃。濃厚なCO₂大気による極端な温室効果。温室効果の極端な例として学ぶ。' },
  { c:4, l:1, q:'ケプラーの第1法則は？', a:['すべて正円軌道','惑星は太陽を焦点とする楕円軌道','公転周期は一定','すべてが同じ軌道'], k:1, e:'惑星は太陽を焦点（中心ではない）とする楕円軌道。→ 近日点で速い、遠日点で遅い。' },
  { c:4, l:1, q:'地球の自転周期（恒星日）は？', a:['24時間','23時間56分4秒','23時間59分','25時間'], k:1, e:'恒星日：23時間56分4秒。太陽日：24時間。その差は地球の公転による見かけの変化。' },
  { c:4, l:1, q:'黄赤大円傾斜角は何度か？', a:['0°','23.4°','45°','90°'], k:1, e:'ほぼ23.4°。この傾斜が季節を生む（春分・夏至・秋分・冬至）。季節変化の根本原因。' },
  { c:4, l:1, q:'地球が形成された時期は？', a:['50億年前','45億年前','40億年前','20億年前'], k:1, e:'地球の誕生：約45億年前。太陽系の形成と同時期。隕石年代測定による確定年代。' },
  { c:4, l:1, q:'原始地球が微惑星衝突によってどうなったか？', a:['そのまま冷えた','表層が融けてマグマオーシャンを形成','分裂した','静止した'], k:1, e:'微惑星大量衝突→地球の表層が融ける→マグマオーシャン形成→その後徐々に冷却→地殻形成。' },
  { c:4, l:1, q:'1光年とは？', a:['太陽が1年で移動する距離','光が1年間に進む距離','地球が1年で公転する距離','最も近い恒星までの距離'], k:1, e:'1光年≈9.46×10¹⁵ m。シリウスまで8.6光年＝その光が地球に着くのに8.6年。宇宙スケールの理解に必須。' },
  { c:4, l:1, q:'太陽が属する銀河は？', a:['アンドロメダ銀河','銀河系（天の川銀河）','マゼラン星雲','ソンブレロ銀河'], k:1, e:'銀河系：棒状渦巻銀河。約2000～4000億個の恒星。太陽系は銀河系の周辺部に位置。' },
  { c:4, l:1, q:'太陽の平均表面温度は？', a:['3000K','5800K','10000K','15000K'], k:1, e:'太陽の表面温度≈5800K。コロナは100万K以上。ウィーンの則で太陽放射を説明。' },
  { c:4, l:1, q:'太陽の寿命として最も正確なのはどれか？', a:['50億年','100億年','150億年','200億年'], k:1, e:'太陽はあと約50億年で赤色巨星化。現在すでに誕生から45億年経過。地球の滅亡の時間スケール。' },

  // 第4章応用（L2：8問）
  { c:4, l:2, q:'ケプラーの第3法則T²∝a³で、公転周期が木星の2倍なら軌道長半径の比は？', a:['2倍','2.8倍','4倍','8倍'], k:1, e:'a ∝ T^(2/3)。T₂=2T₁なら a₂ = a₁ × 2^(2/3) ≈ 1.59倍。計算問題。' },
  { c:4, l:2, q:'地球の公転軌道が楕円形である証拠は何か？', a:['季節の変化','1月と7月の太陽の見かけの大きさの違い','太陽定数の変化','気温の変化'], k:1, e:'地球は1月に太陽に最も近い（近日点）→太陽の見かけの大きさが大きい→太陽放射が多い。' },
  { c:4, l:2, q:'夏至の日、北緯45°での太陽の南中高度は？', a:['21.6°','45°','68.6°','90°'], k:2, e:'南中高度 = 90° - |北緯 - 太陽赤緯|。夏至の太陽赤緯は+23.4°。90° - |45° - 23.4°| = 68.6°。計算問題。' },
  { c:4, l:2, q:'季節変化の主な原因は？', a:['地球と太陽の距離の変化','地球の公転軌道面と赤道面のなす角度（黄赤大円傾斜角）','太陽活動の変化','月の引力'], k:1, e:'黄赤大円傾斜角≈23.4°。これが南中高度の季節変化を生み→気温の季節変化。距離ではない。' },
  { c:4, l:2, q:'地球型惑星と木星型惑星が形成される領域が異なる理由は？', a:['太陽からの距離による温度差','星間塵の密度','重力場の強さ','太陽風の影響'], k:0, e:'太陽近くは温度が高い→揮発性物質が蒸発→残された岩石で小さな惑星。遠くは冷えている→ガスも凝結→大きな惑星。' },
  { c:4, l:2, q:'恒星の色と表面温度の関係は？', a:['赤い恒星は温度が高い','青い恒星は温度が高い','白い恒星は温度が低い','色と温度は無関係'], k:1, e:'ウィーンの則：温度が高い恒星は青く見え、低い恒星は赤く見える。スペクトル分類の基礎。' },
  { c:4, l:2, q:'太陽系外惑星の発見方法として最も一般的なのはどれか？', a:['直接観測','恒星の明るさの変化（トランジット法）','スペクトル分析','位置の変化（視差）'], k:1, e:'トランジット法：惑星が恒星の前を通過時に明るさが低下することを利用。現在の主流。' },

  // 第5章：生物の変遷と地球環境（L1基礎：15問、L2応用：8問）
  { c:5, l:1, q:'過去100年間の全球平均気温は？', a:['低下している','上昇している（約1℃）','ほぼ一定','周期的に変動'], k:1, e:'20世紀後半以降、特に加速。1901-2020年で約1.09℃上昇。温暖化は科学的事実。' },
  { c:5, l:1, q:'CO₂濃度の急速な増加の主な原因は？', a:['火山活動','太陽活動','化石燃料の燃焼','森林形成'], k:2, e:'産業革命以降、化石燃料燃焼によりCO₂が280ppm(1850年)→420ppm(2023年)に増加。人為的気候変動。' },
  { c:5, l:1, q:'海面上昇の主な原因は？', a:['南極の氷がすべて融ける','海水の膨張＆陸氷融解','オゾン層破壊','塩分変化'], k:1, e:'上昇の約90%は海水の膨張（温暖化）。約10%は陸上の氷融解。温暖化の直接的な影響。' },
  { c:5, l:1, q:'示準化石が示準化石たる条件は？', a:['地球規模で分布＆生存期間短い＆進化が速い','個体数が多いだけ','すべての地層に含まれる','大きいだけ'], k:0, e:'示準化石：広く分布＆短い時間幅＆進化速度大→同年代の地層の判定に使える。最重要概念。' },
  { c:5, l:1, q:'アンモナイトが示準化石として優れている理由は？', a:['大きいから','進化が速く、短期間で形が大きく変わるから','世界中で見つかるから','すべての地層に含まれる'], k:1, e:'アンモナイト：中生代の代表示準化石。進化速度が高く、形態変化で時間軸に高い解像度を与える。' },
  { c:5, l:1, q:'自然選択説の基本的な考えは？', a:['すべての変異は有利','環境に適応した個体が多く繁殖','すべての生物は変化しない','設計者が決めた'], k:1, e:'ダーウィン説：環境に適応した形質を持つ個体が生き残り繁殖→種の進化。進化生物学の基本。' },
  { c:5, l:1, q:'全球凍結（Snowball Earth）が起きた時代は？', a:['先カンブリア時代','古生代','中生代','新生代'], k:0, e:'全球凍結は先カンブリア時代（約24億年前と7億年前）に起きたと考えられる。地球史の大事件。' },
  { c:5, l:1, q:'オゾン層を破壊する物質は？', a:['CO₂','CFC（フロン）','N₂O','SO₂'], k:1, e:'CFC：紫外線で分解→塩素原子放出→オゾン破壊。1個のClで10万個のO₃を破壊。' },
  { c:5, l:1, q:'大規模な火山噴火が気候に与える影響は？', a:['気温が上昇','気温が低下する','影響がない','気圧が上昇'], k:1, e:'火山灰とエアロゾルが大気上層に→太陽放射が遮られる→気温低下。例：ピナツボで翌年-0.5℃。' },
  { c:5, l:1, q:'地質時代を主に何を基準に区分するか？', a:['気温の変化','生物の進化・変遷（示準化石）','プレートの運動','太陽活動'], k:1, e:'地質時代：古生代・中生代・新生代など。示準化石で区分。この区分法が地層年代測定の基本。' },
  { c:5, l:1, q:'進化が速い生物の特徴は？', a:['大型で長寿命','世代時間が短く、個体数が多い','ゆっくりした環境変化','不変の環境'], k:1, e:'短世代＝世代交代が速い→遺伝的多様性が速く蓄積→進化が速い。示準化石の条件に一致。' },
  { c:5, l:1, q:'生物大量絶滅の原因として考えられるのはどれか？', a:['隕石衝突のみ','火山活動のみ','気候変動のみ','複数の要因の複合'], k:3, e:'白亜紀末（K-Pg境界）の大絶滅：隕石衝突＋火山活動＋気候変動が複合。単一原因説では不十分。' },
  { c:5, l:1, q:'かつての地球が持っていた酸素のない大気から、現在の酸素に満ちた大気へと変わったのはなぜか？', a:['太陽活動の変化','生物の光合成による酸素生産','火山ガスの変化','大気循環の変化'], k:1, e:'シアノバクテリアの光合成によって酸素が大気に放出→グレートオキシデーション（約24億年前）。酸素呼吸生物の出現を可能に。' },
  { c:5, l:1, q:'マウンダー極小期（1645-1715年）では何が起きたか？', a:['太陽活動が活発化','太陽活動が低下','火山が頻発','CO₂が急増'], k:1, e:'マウンダー極小期：太陽黒点数が激減 → 太陽活動低下 → 気温低下（「小氷河期」）。' },

  // 第5章応用（L2：8問）
  { c:5, l:2, q:'同じ示準化石の系統が2層で見つかったら、両層は？', a:['同じ年代','まったく異なる年代','指定できない','下層のみ古い'], k:0, e:'同じ示準化石＝同年代。異なる系統＝異なる年代。地層の時代判定の基本原理。' },
  { c:5, l:2, q:'地層の重なり（累重の法則）から判断できることは？', a:['地層の温度','相対的な年代順序（新旧の判定）','気候の変化','生物の進化速度'], k:1, e:'累重の法則：下の地層が古く、上の地層が新しい。ただし褶曲・断層で順序が入れ替わることもある。' },
  { c:5, l:2, q:'火山灰の層が2つの地層の間に挟まっていることから何がわかるか？', a:['両地層は同じ年代','火山灰層の年代の地層である両者は同時期に堆積','火山活動は稀である','気候が寒冷だった'], k:1, e:'火山灰層のテフロクロノロジー：火山灰層は一瞬で堆積するため、その上下の地層の同時期性を証明。年代測定の強力な手段。' },
  { c:5, l:2, q:'生物の化石記録から推測できることはどれか？', a:['過去の生物の多様性と生きていた時代','正確な個体数','生物の行動パターン','すべての生物の化石が存在'], k:0, e:'化石記録：不完全ながら、過去の生物多様性と進化の流れを示す。稀な化石化条件を考慮した解釈が必要。' },
  { c:5, l:2, q:'放射性炭素年代測定が有効な年代範囲はどのくらいか？', a:['数百年','数千年','数万年（約5万年まで）','数百万年'], k:2, e:'C-14の半減期は5730年。理論的には約5万年まで測定可能。それ以上古いものはK-Ar法など他の方法を使用。' },
  { c:5, l:2, q:'生物多様性が最も豊かな地質時代はどれか？', a:['古生代','中生代','新生代','先カンブリア時代'], k:2, e:'新生代（特に新第三紀以降）が最も多様。現在の生物相は新生代の進化で形成。古生代は海棲生物が中心。' },
  { c:5, l:2, q:'恐竜が絶滅して、その後に哺乳動物が繁栄した理由は？', a:['哺乳動物の方が強かった','恐竜が絶滅した生態的地位を埋めるニッチが生じた','温暖化で哺乳動物に有利な環境になった','哺乳動物の進化が加速した'], k:1, e:'K-Pg絶滅イベント（6600万年前）：大型爬虫類が消滅→空いたニッチを小型哺乳動物が占める→多様化。進化の空きスペース仮説。' },

  // ===== L3実践問題・計算問題・複合問題（35問） =====
  { c:6, l:3, q:'プレートテクトニクスにより、日本列島で火山と地震が多い理由を最も適切に説明しているのはどれか？', a:['太陽放射が強いから','複数のプレート境界が存在し、プレートの沈み込みと圧縮によって火山と地震が発生する','海に囲まれているから','気温が低いから'], k:1, e:'日本は太平洋プレート・フィリピン海プレート・ユーラシアプレートが相互作用する地帯。沈み込み帯で火山・地震が多発。地理的特性の理解。' },
  { c:6, l:3, q:'初期微動継続時間が30秒で、複数の観測点のデータから震源が求まるのはなぜか？', a:['個々の観測点で震源がわかる','三点法により三角測量的に震源を決定できる','初期微動継続時間だけで十分','複数のデータは不要'], k:1, e:'各観測点での初期微動継続時間→各点から震源までの距離を計算→複数の円の交点が震源。三次元では深さも特定。' },
  { c:6, l:3, q:'大気のエネルギー収支モデルで、地球が受け取るエネルギーと放出するエネルギーが平衡しているとき、地表気温は？', a:['上昇する','低下する','変わらない','判定できない'], k:2, e:'入射エネルギー（太陽放射）＝放射エネルギー（赤外線）の平衡状態が温度安定。温室効果ガス増加で平衡が崩れ→気温上昇。' },
  { c:6, l:3, q:'温室効果ガスがなかった場合と現在の気温差が約33℃である理由として、最も適切なのはどれか？', a:['太陽放射が30%増加している','地表放射が大気で吸収され、その一部が地表に戻されている','地球の自転が遅くなっている','オゾン層の厚さが変わった'], k:1, e:'温室効果ガスが赤外線を吸収・再放射。この「毛布効果」が約33℃の温暖化をもたらす。温暖化理論の中核。' },
  { c:6, l:3, q:'地層が褶曲している場合、累重の法則をどのように適用するか？', a:['上下関係は変わらない','褶曲しているので上下関係が逆になる可能性がある','褶曲は地層年代に影響しない','地層の中央が最も新しい'], k:1, e:'褶曲による逆転に注意。褶曲軸の両側で上下が逆転する可能性。正確な地層解釈には褶曲構造の理解が不可欠。' },
  { c:6, l:3, q:'共通テスト型問題：地球の構造・プレート・地震のすべてに関係する記述として最も正確なのはどれか？', a:['外核が固結してプレートが動く','液体外核の運動がプレート運動を直接駆動する','マントル対流がプレートを動かし、プレート境界で地震が多発する','太陽放射がプレート運動に影響する'], k:2, e:'地球内部熱によるマントル対流がプレート駆動力。プレート運動がストレス蓄積→地震。単元横断的な理解。' },
  { c:6, l:3, q:'過去100年の気温上昇が約1℃であるのに対し、極域（北極）の気温上昇が2倍以上である理由は？', a:['極域への太陽放射が強い','アイスアルベド効果：氷が減少→アルベド低下→更に温度上昇が加速','火山活動が多い','海流が変化した'], k:1, e:'フィードバック機構：温暖化で氷が融ける→反射率低下→吸収増加→更に温暖化。極増幅と呼ばれる現象。気候学の重要テーマ。' },

function render() {
  const app = document.getElementById('app');
  if(!screens[state.screen]) {
    state.screen = 'home';
  }
  app.innerHTML = screens[state.screen]();
  if(state.screen === 'question' && state.answers.length > state.currentQuestion) {
    showFeedback();
  }
  document.getElementById('qcount').textContent = BANK.length;
}

function goToGuide() {
  state.screen = 'guide';
  state.guideChapter = 1;
  render();
}

function switchGuideChapter(chapter) {
  state.guideChapter = chapter;
  render();
}

function startMode(mode, category) {
  state.mode = mode;
  state.score = 0;
  state.answers = [];
  state.currentQuestion = 0;

  if(mode === 'daily') {
    state.questions = BANK.filter(q => q.l === 1 && q.c !== 6).sort(() => Math.random() - 0.5).slice(0, 5);
  } else if(mode === 'unit') {
    state.questions = BANK.filter(q => q.c === category).slice(0, 12);
  } else if(mode === 'standard') {
    state.questions = BANK.filter(q => q.l === 2).slice(0, 40);
  } else if(mode === 'test30') {
    state.questions = BANK.filter(q => q.c !== 6).sort(() => Math.random() - 0.5).slice(0, 30);
  } else if(mode === 'test50') {
    state.questions = BANK.filter(q => q.c !== 6).sort(() => Math.random() - 0.5).slice(0, 50);
  } else if(mode === 'challenge') {
    state.questions = BANK.filter(q => q.l === 3).slice(0, 20);
  }

  state.screen = 'question';
  render();
}

function answer(index) {
  const q = state.questions[state.currentQuestion];
  const isCorrect = index === q.k;
  state.answers[state.currentQuestion] = isCorrect;
  if(isCorrect) state.score++;

  document.querySelectorAll('.opt').forEach(btn => btn.disabled = true);
  if(isCorrect) {
    document.getElementById('opt' + index).classList.add('ok');
  } else {
    document.getElementById('opt' + index).classList.add('ng');
    document.getElementById('opt' + q.k).classList.add('ok');
  }

  showFeedback();

  setTimeout(() => {
    if(state.currentQuestion < state.questions.length - 1) {
      state.currentQuestion++;
      state.screen = 'question';
      render();
    } else {
      state.screen = 'result';
      render();
    }
  }, isCorrect ? 1500 : 3000);
}

function showFeedback() {
  const q = state.questions[state.currentQuestion];
  const isCorrect = state.answers[state.currentQuestion];
  const fbEl = document.getElementById('fb');
  if(!fbEl || isCorrect === undefined) return;

  fbEl.className = `fb ${isCorrect ? 'ok' : 'ng'}`;
  fbEl.innerHTML = `
    <div class="hd">${isCorrect ? '✓ 正解！' : '✗ 不正解'}</div>
    <strong>解説：</strong>${q.e}
  `;
}

function goHome() {
  state.screen = 'home';
  render();
}

window.onload = () => render();
</script>
</body>
</html>
